    --text-muted: #e0e0e0;
    --text-dark: #aaaaaa;
    --green: #2ed573;
    --red: #ff5b68;
    --font-serif: 'Cinzel', serif;
    --font-sans: 'Montserrat', sans-serif;
    --blur-effect: blur(18px);

* { margin: 0; padding: 0; box-sizing: border-box; }
a { color: inherit; text-decoration: none; }

.search-input:focus { border-color: var(--gold); background: rgba(0, 0, 0, 0.64); }

.user-tools { display: flex; align-items: center; gap: 24px; }
.location-indicator { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; white-space: nowrap; }
.location-indicator svg, .tool-icon svg { width: 18px; height: 18px; fill: var(--gold); }

}

.categories-list { display: flex; flex-direction: column; gap: 6px; list-style: none; }
.category-item { list-style: none; }
.category-item button {

    border: 1px solid rgba(229, 193, 88, 0.28);

    border-radius: 12px;

    align-items: center;
    gap: 14px;
    cursor: pointer;
    text-align: left;
    color: #fff;
}
.category-item button:hover, .category-item.active button, .category-item button.active { border-color: var(--gold); background: rgba(229, 193, 88, 0.10); }
.icon-container { width: 28px; height: 28px; flex: 0 0 28px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); font-size: 15px; }

.category-name { font-size: 11.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
.category-count { color: var(--text-dark); font-size: 9px; }
.main-boulevard {

}

.aside-showcase-list {

}
.showcase-header { padding: 20px 14px 8px 14px; }
.showcase-header h2 { font-family: var(--font-serif); color: var(--gold); font-size: 13px; letter-spacing: 1px; text-transform: uppercase; }

.sort-box { padding: 0 14px 10px 14px; border-bottom: 1px solid rgba(255,255,255,.08); }

.shops-scroll-area { flex: 1; overflow-y: auto; padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; }
.shop-card { min-height: 64px; display: flex; overflow: hidden; border-radius: 8px; background: var(--bg-card); border: 1px solid rgba(255,255,255,.08); color: inherit; }
.shop-card:hover { border-color: rgba(229,193,88,.45); background: rgba(229,193,88,.10); }
.shop-thumb-wrapper { width: 64px; height: 64px; flex: 0 0 64px; background: radial-gradient(circle at 30% 25%, rgba(229,193,88,.22), transparent 38%), linear-gradient(135deg, rgba(229,193,88,.10), rgba(0,0,0,.78)); display: flex; align-items: center; justify-content: center; color: var(--gold); font-size: 24px; }
.shop-thumb { width: 100%; height: 100%; object-fit: cover; display: block; }
.shop-details { flex: 1; min-width: 0; padding: 6px 10px; display: flex; flex-direction: column; justify-content: center; }
.shop-title { font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.shop-rating-row { display: flex; align-items: center; gap: 4px; margin-top: 2px; }
.star-icon { color: var(--gold); font-size: 10px; }
.rating-value { font-size: 10px; font-weight: 700; }
.rating-count { font-size: 9.5px; color: var(--text-dark); }
.status-indicator { margin-left: auto; font-size: 9.5px; font-weight: 700; color: var(--green); }
.status-indicator.closed { color: var(--red); }
.empty-state { min-height: 86px; border: 1px dashed rgba(229,193,88,.26); border-radius: 8px; padding: 18px 14px; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--text-muted); font-size: 11px; line-height: 1.5; background: rgba(0,0,0,.24); }
.action-footer-box { padding: 10px 14px; border-top: 1px solid rgba(255,255,255,.08); }
.btn-view-all-shops { width: 100%; background: var(--gold); border: none; border-radius: 6px; padding: 8px; color: #000; font-size: 11.5px; font-weight: 700; cursor: pointer; }
.pie-pagina { position: fixed; left: 0; right: 0; bottom: 0; height: 24px; z-index: 9999; background: #000; color: #8c8c8c; font-size: 11px; display: flex; align-items: center; justify-content: center; border-top: 1px solid #1a1a1a; font-family: Arial, Helvetica, sans-serif; }
.directory-modal { position: fixed; inset: 0; z-index: 10000; display: none; align-items: center; justify-content: center; padding: 24px; background: rgba(0,0,0,.76); backdrop-filter: blur(10px); }
.directory-modal.open { display: flex; }
.directory-box { width: min(980px, 96vw); max-height: min(760px, 88vh); display: flex; flex-direction: column; border: 1px solid rgba(229,193,88,.36); border-radius: 18px; background: rgba(8,8,8,.96); overflow: hidden; }
.directory-head { padding: 18px; border-bottom: 1px solid rgba(255,255,255,.08); display: flex; justify-content: space-between; align-items: center; gap: 16px; }
.directory-head h2 { font-family: var(--font-serif); color: var(--gold); font-size: 18px; }

    .shops-scroll-area { display: flex; flex-direction: column; overflow: visible; }
    .pie-pagina { height: 24px; }
}
</style>

    align-items:center;
    gap:9px;

.uxd-search,
.uxd-sort{
    position:relative;
    min-width:0;
}

.uxd-search svg{
    position:absolute;
    left:13px;
    top:50%;
    width:15px;
    height:15px;
    transform:translateY(-50%);
    fill:#ffb43b;
    pointer-events:none;

.uxd-search input,
.uxd-sort select{
    width:100%;
    height:42px;
    border:1px solid rgba(255,255,255,.18);
    border-radius:11px;
    outline:none;
    background:rgba(255,255,255,.10);
    color:#fff;
    font-family:var(--font-sans);
    font-size:10px;
    font-weight:600;
    transition:border-color .2s ease,background .2s ease,box-shadow .2s ease;
}

.uxd-search input{
    padding:0 13px 0 38px;
}

.uxd-search input::placeholder{
    color:#bdc7d5;
}

.uxd-sort select{
    padding:0 30px 0 11px;
    cursor:pointer;
}

.uxd-sort select option{
    background:#fff;
    color:#172033;
}

.uxd-search input:focus,
.uxd-sort select:focus{
    border-color:var(--uxd-orange);
    background:rgba(255,255,255,.15);
    box-shadow:0 0 0 3px rgba(255,159,10,.18);
}

.uxd-close{
    width:42px;
    height:42px;
    display:grid;
    place-items:center;
    border:1px solid rgba(255,255,255,.24);
    border-radius:11px;
    background:rgba(255,255,255,.10);
    color:#fff;
    cursor:pointer;
    transition:transform .2s ease,background .2s ease,border-color .2s ease;
}

.uxd-close:hover{
    transform:translateY(-2px);
    border-color:var(--uxd-orange);
    background:var(--uxd-orange);
    color:#171918;
}

.uxd-close svg{
    width:18px;
    height:18px;
    fill:currentColor;
}

.uxd-close:focus-visible,
.uxd-card:focus-visible{
    outline:3px solid var(--uxd-orange);
    outline-offset:3px;
}

.uxd-summary{
    min-height:43px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:8px 18px;
    border-bottom:1px solid var(--uxd-line);
    background:#fff;
    color:var(--uxd-muted);
    font-size:9px;
}

.uxd-summary strong{
    color:var(--uxd-navy);
    font-weight:800;
}

.uxd-summary-count{
    display:inline-flex;
    align-items:center;
    gap:7px;
    flex:0 0 auto;
    color:var(--uxd-navy);
    font-weight:800;
}

.uxd-summary-count::before{
    content:"";
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--uxd-orange);
    box-shadow:0 0 0 4px rgba(255,159,10,.13);
}

.uxd-grid{
    min-height:0;
    overflow-y:auto;
    overscroll-behavior:contain;
    display:grid;
    grid-template-columns:repeat(6,minmax(0,1fr));
    align-content:start;
    gap:12px;
    padding:16px;
    scrollbar-gutter:stable;
}

.uxd-card{
    position:relative;
    min-width:0;
    min-height:226px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    border:1px solid var(--uxd-line);
    border-radius:15px;
    background:var(--uxd-card);
    color:var(--uxd-text);
    text-decoration:none;
    box-shadow:var(--uxd-shadow);
    transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease;
}

.uxd-card::before{
    content:"";
    position:absolute;
    inset:0 0 auto;
    z-index:5;
    height:4px;
    background:linear-gradient(90deg,var(--uxd-orange) 0 34%,var(--uxd-navy) 34% 100%);
}

.uxd-card:hover{
    transform:translateY(-4px);
    border-color:rgba(255,159,10,.66);
    box-shadow:0 18px 38px rgba(20,43,77,.16);
}

.uxd-card-media{
    position:relative;
    width:100%;
    height:112px;
    flex:0 0 112px;
    display:grid;
    place-items:center;
    overflow:hidden;
    padding:11px;
    border-bottom:1px solid #e8edf2;
    background:
        radial-gradient(circle at 50% 28%,rgba(255,159,10,.12),transparent 38%),

}

.uxd-card-media img{
    width:100%;
    height:100%;
    display:block;
    object-fit:contain;
    object-position:center;
    border-radius:8px;
    background:#fff;
    transition:transform .3s ease;
}

.uxd-card:hover .uxd-card-media img{
    transform:scale(1.035);
}

.uxd-featured{
    position:absolute;
    top:9px;
    right:9px;
    z-index:3;

    align-items:center;
    min-height:20px;
    padding:0 7px;
    border:1px solid rgba(255,159,10,.55);
    border-radius:999px;
    background:rgba(20,43,77,.94);
    color:#ffd998;
    font-size:6px;
    font-weight:900;
    letter-spacing:.45px;
    text-transform:uppercase;
}

.uxd-placeholder{
    width:58px;
    height:58px;
    display:grid;
    place-items:center;
    border:1px solid rgba(255,159,10,.48);
    border-radius:16px;
    background:var(--uxd-navy);
    color:#fff;
}

.uxd-placeholder svg{
    width:28px;
    height:28px;
    fill:currentColor;
}

.uxd-card-body{
    min-width:0;
    flex:1;
    display:flex;
    flex-direction:column;
    padding:11px 11px 10px;
}

.uxd-category{
    min-width:0;
    overflow:hidden;
    color:#a25f00;
    font-size:6.7px;
    font-weight:900;
    line-height:1.25;
    letter-spacing:.55px;
    text-overflow:ellipsis;
    text-transform:uppercase;
    white-space:nowrap;
}

.uxd-card h3{
    min-height:31px;
    margin:6px 0 0;
    overflow:hidden;
    color:var(--uxd-navy);
    font-size:11.5px;
    font-weight:800;
    line-height:1.28;
    display:-webkit-box;
    -webkit-box-orient:vertical;
    -webkit-line-clamp:2;
}

.uxd-location{
    min-width:0;
    display:flex;
    align-items:center;
    gap:5px;
    margin-top:6px;
    color:var(--uxd-muted);
    font-size:7.5px;
    line-height:1.35;
}

.uxd-location svg{
    width:10px;
    height:10px;
    flex:0 0 10px;
    fill:var(--uxd-orange);
}

.uxd-location span{
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.uxd-card-footer{
    min-width:0;
    min-height:29px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:7px;
    margin-top:auto;
    padding-top:8px;
    border-top:1px solid #edf1f4;
}

.uxd-status{
    min-width:0;
    display:inline-flex;
    align-items:center;
    gap:5px;
    color:#945900;
    font-size:7px;
    font-weight:800;
    white-space:nowrap;
}

.uxd-status::before{
    content:"";
    width:6px;
    height:6px;
    flex:0 0 6px;
    border-radius:50%;
    background:var(--uxd-orange);
    box-shadow:0 0 0 3px rgba(255,159,10,.12);
}

.uxd-status.is-open{
    color:#087443;
}

.uxd-status.is-open::before{
    background:var(--uxd-green);
    box-shadow:0 0 0 3px rgba(21,145,90,.12);
}

.uxd-card-action{
    flex:0 0 auto;
    display:inline-flex;
    align-items:center;
    gap:4px;
    color:var(--uxd-navy);
    font-size:7px;
    font-weight:900;
    white-space:nowrap;
}

.uxd-card-action svg{
    width:12px;
    height:12px;
    fill:currentColor;
}

.uxd-card:hover .uxd-card-action{
    color:#a25f00;
}

.uxd-empty{
    grid-column:1/-1;
    min-height:210px;

    place-items:center;
    padding:30px;
    border:1px dashed #c7d1dc;
    border-radius:17px;
    background:#fff;
    color:#657185;
    text-align:center;
    font-size:12px;
    line-height:1.55;
}

.uxd-skeleton{
    min-height:226px;
    border-radius:15px;
    background:
        linear-gradient(90deg,transparent,rgba(255,255,255,.72),transparent),
        #dfe6ed;
    background-size:220% 100%;
    animation:uxdSkeleton 1.25s linear infinite;
}

@keyframes uxdSkeleton{
    to{background-position:-220% 0;}

function normalize(value) {
    return String(value || '')
        .trim()
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/\s+/g, ' ');
}

function esc(value) {
    return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

function toNum(value) {
    const number = Number(value);
    return Number.isFinite(number) ? number : null;
}

function plural(count, singular = 'local', pluralText = 'locales') {
    return `${count} ${count === 1 ? singular : pluralText}`;
}

function isRootCategory(category) {
    return category.parent_id === null ||
           category.parent_id === undefined ||
           category.parent_id === '';
}

function categoryParameter() {
    return new URLSearchParams(location.search).get('categoria');
}

function resolveRootCategory(parameter) {
    if (!parameter) return null;

    const id = toNum(parameter);
    if (id !== null) {
        const byId = rootCategories.find(category => toNum(category.id) === id);
        if (byId) return byId;
    }

    const target = normalize(parameter);
    return rootCategories.find(category => normalize(category.name) === target) ||
           rootCategories.find(category => {
               const name = normalize(category.name);
               return name.includes(target) || target.includes(name);
           }) || null;
}

    return {
        title: root?.display_title || preset.title || String(root?.name || 'Categoría').toUpperCase(),
        subtitle: root?.subtitle || preset.subtitle || 'TODOS LOS COMERCIOS DE LOJA EN UN SOLO LUGAR',
        search: root?.search_placeholder || preset.search || '¿Qué producto o servicio busca?',
        image: root?.hero_image || root?.image_url || root?.cover_image || root?.banner_image || preset.image || '../imagenes/Boulevard.png'
    };
}

function applyVisual() {
    const visual = visualForRoot(currentRoot);

    document.title = `Urbanex - ${currentRoot.name}`;
    document.documentElement.style.setProperty('--category-background', `url("${visual.image}")`);
    document.getElementById('siteSearch').placeholder = visual.search;
    document.getElementById('categoryHeroTitle').textContent = visual.title;
    document.getElementById('categoryHeroSubtitle').textContent = visual.subtitle;
    document.getElementById('directoryTitle').textContent = `Directorio completo — ${currentRoot.name}`;
}

function isFeatured(business) {
    return business.is_featured === true ||
           business.is_featured === 1 ||
           String(business.is_featured).toLowerCase() === 'true';
}

function getBusinessRootId(business) {
    const directCategoryId = toNum(business.category_id);
    const subcategoryId = toNum(business.subcategory_id);

    if (directCategoryId === toNum(currentRoot?.id)) {
        return directCategoryId;
    }

    const subcategory = subCategories.find(item =>
        toNum(item.id) === subcategoryId ||
        toNum(item.id) === directCategoryId
    );

    return subcategory ? toNum(subcategory.parent_id) : directCategoryId;
}

function belongsToRoot(business) {
    return currentRoot && getBusinessRootId(business) === toNum(currentRoot.id);
}

function belongsToSubcategory(business, subcategory) {
    const subId = toNum(subcategory?.id);
    if (subId === null) return false;

    return toNum(business.subcategory_id) === subId ||
           toNum(business.category_id) === subId;
}

function getApprovedReviews(business) {
    return (business.reviews || []).filter(review => review.is_approved !== false);
}

function getRating(business) {
    const reviews = getApprovedReviews(business);
    if (!reviews.length) return null;

    return reviews.reduce(
        (sum, review) => sum + Number(review.rating || 0),
        0
    ) / reviews.length;
}

function ecuadorNow() {
    const parts = new Intl.DateTimeFormat('en-US', {
        timeZone: 'America/Guayaquil',
        weekday: 'short',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
    }).formatToParts(new Date());

    const values = Object.fromEntries(parts.map(part => [part.type, part.value]));
    const days = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };

    return {
        day: days[values.weekday],
        minutes: Number(values.hour) * 60 + Number(values.minute)
    };
}

function isOpenNow(business) {
    const hours = business.business_hours || [];
    if (!hours.length) return false;

    const now = ecuadorNow();
    const row = hours.find(item =>
        Number(item.day_of_week) === now.day &&
        item.is_closed !== true
    );

    if (!row?.open_time || !row?.close_time) return false;

    const toMinutes = time => {
        const [hour, minute] = String(time).split(':').map(Number);
        return hour * 60 + (minute || 0);
    };

    const open = toMinutes(row.open_time);
    const close = toMinutes(row.close_time);

    if (!Number.isFinite(open) || !Number.isFinite(close)) return false;

    return close >= open
        ? now.minutes >= open && now.minutes <= close
        : now.minutes >= open || now.minutes <= close;
}

function enrichBusiness(business) {
    return {
        ...business,
        _rating: getRating(business),
        _reviewCount: getApprovedReviews(business).length,
        _openNow: isOpenNow(business)
    };
}

function businessMatchesSearch(business) {
    if (!searchTerm) return true;

    const haystack = normalize(`
        ${business.name || ''}
        ${business.address || ''}
        ${business.categories?.name || ''}
        ${business.subcategories?.name || ''}
    `);

    return haystack.includes(searchTerm);
}

function rootBusinesses() {
    return allBusinesses.filter(business =>
        belongsToRoot(business) &&
        businessMatchesSearch(business)
    );
}

function featuredBusinesses() {
    const sort = document.getElementById('sortSelect')?.value || 'rating';

    const list = globalFeaturedBusinesses
        .filter(isFeatured)
        .filter(businessMatchesSearch)
        .slice();

    if (sort === 'name') {
        list.sort((a, b) =>
            String(a.name || '').localeCompare(String(b.name || ''), 'es')
        );
    } else {
        list.sort((a, b) =>
            (b._rating || 0) - (a._rating || 0) ||
            String(a.name || '').localeCompare(String(b.name || ''), 'es')
        );
    }

    return list;
}

function countBySubcategory(subcategory) {
    return allBusinesses.filter(business =>
        belongsToRoot(business) &&
        belongsToSubcategory(business, subcategory)
    ).length;
}

function renderSubcategories() {
    const container = document.getElementById('categoriesList');
    const total = allBusinesses.filter(belongsToRoot).length;
    const rootId = encodeURIComponent(currentRoot.id);

    const allButton = `
        <li class="category-item active">
            <button type="button" class="active"
                    onclick="window.location.href='index.html?categoria=${rootId}'">
                <div class="icon-container">▦</div>
                <div class="category-text-info">
                    <span class="category-name">Todos</span>
                    <span class="category-count">${plural(total)}</span>
                </div>
            </button>
        </li>
    `;

    const subButtons = currentSubcategories.map(subcategory => {
        const count = countBySubcategory(subcategory);
        const url = `subcategoria.html?categoria=${rootId}&subcategoria=${encodeURIComponent(subcategory.id)}`;

        return `
            <li class="category-item">
                <button type="button"
                        onclick="window.location.href='${url}'">
                    <div class="icon-container">${esc(subcategory.icon || '•')}</div>
                    <div class="category-text-info">
                        <span class="category-name">${esc(subcategory.name)}</span>
                        <span class="category-count">${plural(count)}</span>
                    </div>
                </button>
            </li>
        `;
    }).join('');

    container.innerHTML = allButton + subButtons;
}

function businessUrl(business) {
    if (business.slug) {
        return `../business/?slug=${encodeURIComponent(business.slug)}`;
    }

    if (business.id !== null && business.id !== undefined) {
        return `../business/?id=${encodeURIComponent(business.id)}`;
    }

    return '#';
}

function businessThumb(business) {
    if (business.cover_image) {
        return `<img class="shop-thumb" src="${esc(business.cover_image)}"
                     alt="${esc(business.name)}" loading="lazy">`;
    }

    return `<span>${esc(
        business.subcategories?.icon ||
        business.categories?.icon ||
        currentRoot?.icon ||
        '🏪'
    )}</span>`;
}

function businessCard(business) {
    const ratingText = business._rating ? business._rating.toFixed(1) : '—';
    const reviewText = business._reviewCount
        ? `${business._reviewCount}`
        : 'Sin reseñas';

    const segment =
        business.subcategories?.name ||
        business.categories?.name ||
        currentRoot.name;

    const statusClass = business._openNow ? '' : 'closed';
    const statusText = business._openNow ? 'Abierto' : 'Cerrado';

    return `
        <a class="shop-card" href="${businessUrl(business)}">
            <div class="shop-thumb-wrapper">${businessThumb(business)}</div>
            <div class="shop-details">
                <div class="shop-title">${esc(business.name)}</div>
                <div class="shop-segment">${esc(segment)}</div>
                <div class="shop-rating-row">
                    <span class="star-icon">★</span>
                    <span class="rating-value">${ratingText}</span>
                    <span class="rating-count">${esc(reviewText)}</span>
                    <span class="status-indicator ${statusClass}">${statusText}</span>
                </div>
            </div>
        </a>
    `;
}


function featuredVisibleCount() {
    if (window.innerWidth <= 720) return 1;
    if (window.innerWidth <= 1024) return 2;

    const area = document.getElementById('shopsList');
    const availableHeight = Math.max(
        0,
        area?.clientHeight || (window.innerHeight - 150)
    );

    const cardMinimumHeight = 148;
    const gap = 9;
    const calculated = Math.floor(
        (availableHeight + gap) / (cardMinimumHeight + gap)
    );

    return Math.max(1, Math.min(3, calculated || 1));
}

function stopFeaturedRotation() {
    featuredSlotTimers.forEach(timer => window.clearTimeout(timer));
    featuredSlotTimers = [];
}

function nextUniqueFeaturedIndex(slotIndex, total) {
    if (total <= 1) return 0;

    const occupied = new Set(
        featuredSlotIndices.filter((_, index) => index !== slotIndex)
    );

    let candidate =
        ((featuredSlotIndices[slotIndex] ?? slotIndex) + 1) % total;

    for (let attempt = 0; attempt < total; attempt += 1) {
        if (!occupied.has(candidate)) return candidate;
        candidate = (candidate + 1) % total;
    }

    return featuredSlotIndices[slotIndex] ?? 0;
}

function scheduleFeaturedSlotRotations(list) {
    stopFeaturedRotation();

    if (
        document.hidden ||
        !Array.isArray(list) ||
        list.length <= featuredSlotIndices.length
    ) {
        return;
    }

    const area = document.getElementById('shopsList');
    if (!area) return;

    const intervals = [2600, 4100, 5600];

    featuredSlotIndices.forEach((_, slotIndex) => {
        const rotateSlot = () => {
            if (document.hidden || !area.isConnected) return;

            featuredSlotIndices[slotIndex] =
                nextUniqueFeaturedIndex(slotIndex, list.length);

            const currentCard = area.children[slotIndex];
            const business = list[featuredSlotIndices[slotIndex]];

            if (currentCard && business) {
                const wrapper = document.createElement('div');
                wrapper.innerHTML = featuredBusinessCard(business).trim();

                const nextCard = wrapper.firstElementChild;

                if (nextCard) {
                    nextCard.classList.add('featured-slot-enter');
                    currentCard.replaceWith(nextCard);
                }
            }

            featuredSlotTimers[slotIndex] = window.setTimeout(
                rotateSlot,
                intervals[slotIndex] || intervals[intervals.length - 1]
            );
        };

        featuredSlotTimers[slotIndex] = window.setTimeout(
            rotateSlot,
            intervals[slotIndex] || intervals[intervals.length - 1]
        );
    });
}

function featuredBusinessCard(business) {
    const ratingText = business._rating
        ? business._rating.toFixed(1)
        : '—';

        ? `(${business._reviewCount})`
        : 'Sin reseñas';

    const categoryName =
        business.subcategories?.name ||
        business.categories?.name ||
        currentRoot.name;

    const categoryIcon =
        business.subcategories?.icon ||
        business.categories?.icon ||
        currentRoot?.icon ||
        '🏪';

    const addressLabel = String(
        business.address ||
        business.city ||
        'Dirección no registrada'
    ).trim();

    const cityLabel = String(
        business.city || 'No registrada'
    ).trim();

    const phoneLabel = String(
        business.phone ||
        business.contact_phone ||
        business.whatsapp ||

    ).trim();

    const statusHtml = business._openNow

    const logoHtml = business.cover_image
        ? `
            <div class="ux-featured-logo-box">
                <img
                    class="ux-featured-logo"
                    src="${esc(business.cover_image)}"
                    alt="${esc(business.name)}"
                    loading="lazy"
                >

        `
        : `
            <div class="ux-featured-logo-box ux-featured-logo-fallback">
                <span>${esc(categoryIcon)}</span>
            </div>
        `;

    return `
        <article class="shop-card shop-card-ad ux-featured-card">
            <a
                class="ux-featured-link"
                href="${businessUrl(business)}"
                aria-label="Ver perfil de ${esc(business.name)}"
            >
                <div class="ux-featured-primary">
                    ${logoHtml}

                    <div class="ux-featured-content">
                        <div class="ux-featured-category">
                            <span aria-hidden="true">${esc(categoryIcon)}</span>
                            <span>${esc(categoryName)}</span>
                        </div>

                        <div class="ux-featured-name">
                            ${esc(business.name)}
                        </div>

                        <div
                            class="ux-featured-address"
                            title="${esc(addressLabel)}"
                        >
                            <span aria-hidden="true">⌖</span>
                            <span>${esc(addressLabel)}</span>
                        </div>
                    </div>
                </div>

                <div class="ux-featured-data">
                    <div class="ux-featured-data-item">
                        <span>Ciudad</span>
                        <strong>${esc(cityLabel)}</strong>
                    </div>

                    <div class="ux-featured-data-item">
                        <span>Teléfono</span>
                        <strong>${esc(phoneLabel)}</strong>
                    </div>
                </div>

                <div class="ux-featured-bottom">
                    <div class="ux-featured-rating">
                        <div class="shop-rating-row">
                            <span class="star-icon">★</span>
                            <span class="rating-value">${ratingText}</span>
                            <span class="rating-count">${esc(reviewText)}</span>
                        </div>
                    </div>

                    <div class="ux-featured-status">
                        ${statusHtml}
                    </div>
                </div>
            </a>
        </article>
    `;
}

async function fetchGlobalFeaturedBusinesses() {
    return await supabase
        .from('businesses')
        .select(BUSINESS_SELECT_INITIAL)
        .eq('is_active', true)
        .eq('is_featured', true);
}

async function fetchBusinesses() {
    let query = supabase
        .from('businesses')
        .select(BUSINESS_SELECT_INITIAL)
        .eq('is_active', true);

    const rootId = toNum(currentRoot.id);
    const subcategoryIds = currentSubcategories
        .map(item => toNum(item.id))
        .filter(id => id !== null);

    const filters = [`category_id.eq.${rootId}`];

    if (subcategoryIds.length) {
        filters.push(`category_id.in.(${subcategoryIds.join(',')})`);
        filters.push(`subcategory_id.in.(${subcategoryIds.join(',')})`);
    }

    query = query.or(filters.join(','));
    return await query;
}

function groupRowsByBusiness(rows) {
    const map = new Map();

    (rows || []).forEach(row => {
        const key = String(row.business_id);
        if (!map.has(key)) map.set(key, []);
        map.get(key).push(row);
    });

    return map;
}

async function loadBusinessDetails() {
    const combinedBusinesses = [
        ...allBusinesses,
        ...globalFeaturedBusinesses
    ];

    const ids = Array.from(
        new Set(
            combinedBusinesses
                .map(business => business.id)
                .filter(id => id !== null && id !== undefined)
        )
    );

    if (!ids.length) return;

    try {
        const [hoursResult, reviewsResult] = await Promise.all([
            supabase
                .from('business_hours')
                .select('business_id,day_of_week,open_time,close_time,is_closed')
                .in('business_id', ids),

            supabase
                .from('reviews')
                .select('business_id,is_approved,rating')
                .eq('is_approved', true)
                .in('business_id', ids)
        ]);

        const hoursByBusiness = groupRowsByBusiness(hoursResult.data || []);
        const reviewsByBusiness = groupRowsByBusiness(reviewsResult.data || []);

        const enrichWithDetails = business => enrichBusiness({
            ...business,
            business_hours:
                hoursByBusiness.get(String(business.id)) || [],
            reviews:
                reviewsByBusiness.get(String(business.id)) || []
        });

        allBusinesses = allBusinesses.map(enrichWithDetails);
        globalFeaturedBusinesses =
            globalFeaturedBusinesses.map(enrichWithDetails);

        renderSubcategories();
        renderFeatured();

        const directoryModal = document.getElementById('directoryModal');
        if (directoryModal?.classList.contains('open')) {
            window.openDirectory();
        }
    } catch (error) {
        console.warn('No se pudieron cargar horarios o reseñas:', error);
    }
}

function renderError(message) {
    document.getElementById('categoriesList').innerHTML = '';
    document.getElementById('shopsList').innerHTML =
        `<div class="empty-state">${esc(message)}</div>`;
    document.getElementById('showcaseStats').textContent = 'Error de carga';
}

async function boot() {
    try {
        const parameter = categoryParameter();

        if (!parameter) {
            window.location.replace('../boulevard.html');
            return;
        }

        const categoriesResult = await supabase
            .from('categories')
            .select('*')
            .eq('is_active', true)
            .order('sort_order', { ascending: true })
            .order('name', { ascending: true });

        if (categoriesResult.error) throw categoriesResult.error;

        const categories = categoriesResult.data || [];
        rootCategories = categories.filter(isRootCategory);
        subCategories = categories.filter(category => !isRootCategory(category));
        currentRoot = resolveRootCategory(parameter);

        if (!currentRoot) {
            throw new Error('La categoría no existe o está inactiva.');
        }

        currentSubcategories = subCategories
            .filter(category =>
                toNum(category.parent_id) === toNum(currentRoot.id)
            )
            .sort((a, b) =>
                Number(a.sort_order || 0) - Number(b.sort_order || 0) ||
                String(a.name || '').localeCompare(String(b.name || ''), 'es')
            );

        applyVisual();

        const [businessResult, featuredResult] = await Promise.all([
            fetchBusinesses(),
            fetchGlobalFeaturedBusinesses()
        ]);

        if (businessResult.error) throw businessResult.error;
        if (featuredResult.error) throw featuredResult.error;

        const applyLocation = business =>
            !window.UrbanexLocation ||
            window.UrbanexLocation.matchesBusiness(business);

        const prepareBusiness = business => enrichBusiness({
            ...business,
            business_hours: business.business_hours || [],
            reviews: business.reviews || []
        });

        allBusinesses = (businessResult.data || [])
            .map(prepareBusiness)
            .filter(applyLocation);

        globalFeaturedBusinesses = (featuredResult.data || [])
            .map(prepareBusiness)
            .filter(applyLocation);

        renderSubcategories();
        renderFeatured();

        const runLater =
            window.requestIdleCallback ||
            (callback => window.setTimeout(callback, 700));

        runLater(loadBusinessDetails);
    } catch (error) {
        console.error(error);
        renderError(
            error?.message ||
            'No se pudo cargar la información desde Supabase.'
        );
    }
}

function renderFeatured() {
    const list = featuredBusinesses();
    const container = document.getElementById('shopsList');
    const stats = document.getElementById('showcaseStats');

    stats.textContent =
        `${list.length} destacado${list.length !== 1 ? 's' : ''} ` +
        `seleccionado${list.length !== 1 ? 's' : ''}`;

    stopFeaturedRotation();

    if (!list.length) {
        featuredCarouselSignature = '';
        featuredSlotIndices = [];
        container.removeAttribute('data-visible-count');
        container.innerHTML =
            `<div class="empty-state">` +
            `No hay negocios destacados seleccionados en Supabase.` +
            `</div>`;
        return;
    }

    const visibleCount = Math.max(
        1,
        Math.min(featuredVisibleCount(), list.length)
    );

    const sort = document.getElementById('sortSelect')?.value || 'rating';
    const signature =
        `${sort}|${searchTerm}|${list.map(item => item.id).join(',')}`;

    const mustReset =
        signature !== featuredCarouselSignature ||
        featuredSlotIndices.length !== visibleCount ||
        featuredSlotIndices.some(index => index >= list.length);

    if (mustReset) {
        featuredCarouselSignature = signature;
        featuredSlotIndices = Array.from(
            { length: visibleCount },
            (_, index) => index % list.length
        );
    }

    const visibleBusinesses =
        featuredSlotIndices.map(index => list[index]);

    container.dataset.visibleCount = String(visibleCount);
    container.classList.remove('featured-changing');
    void container.offsetWidth;
    container.innerHTML =
        visibleBusinesses.map(featuredBusinessCard).join('');
    container.classList.add('featured-changing');

    scheduleFeaturedSlotRotations(list);
}

window.openDirectory = () => {
    const list = rootBusinesses().sort((a, b) =>
        String(a.name || '').localeCompare(String(b.name || ''), 'es')
    );

    const grid = document.getElementById('directoryGrid');

    grid.innerHTML = list.length
        ? list.map(businessCard).join('')
        : `<div class="empty-state">No hay negocios para mostrar.</div>`;

    document.getElementById('directoryModal').classList.add('open');
};

window.closeDirectory = () => {
    document.getElementById('directoryModal').classList.remove('open');
};

document.getElementById('directoryModal').addEventListener('click', event => {
    if (event.target.id === 'directoryModal') closeDirectory();
});

document.getElementById('siteSearch').addEventListener('input', event => {
    searchTerm = normalize(event.target.value);
    renderFeatured();
});

document.getElementById('sortSelect').addEventListener('change', renderFeatured);

document.addEventListener('keydown', event => {
    if (event.key === 'Escape') closeDirectory();
});


document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        stopFeaturedRotation();
    } else {
        renderFeatured();
    }
});

let featuredResizeTimer = null;
window.addEventListener('resize', () => {
    window.clearTimeout(featuredResizeTimer);
    featuredResizeTimer = window.setTimeout(() => {
        renderFeatured();
    }, 120);
});

boot();
</script>



<script id="ux-subcategory-autoscroll-script">
(function () {
    const SPEED_PX_PER_SECOND = 12;
    const MOBILE_QUERY = window.matchMedia('(max-width: 1024px)');

    let bar = null;
    let paused = false;
    let direction = 1;
    let rafId = null;
    let lastTime = 0;
    let resumeTimer = null;

    function canAutoScroll() {
        return Boolean(
            bar &&
            MOBILE_QUERY.matches &&
            bar.scrollWidth > bar.clientWidth + 8
        );
    }

    function pauseAutoScroll() {
        paused = true;
        if (bar) bar.classList.add('ux-auto-paused');

        if (resumeTimer) {
            window.clearTimeout(resumeTimer);
        }

        resumeTimer = window.setTimeout(function () {
            resumeAutoScroll();
        }, 5000);
    }

    function resumeAutoScroll() {
        paused = false;
        lastTime = 0;

        if (resumeTimer) {
            window.clearTimeout(resumeTimer);
            resumeTimer = null;
        }

        if (bar) bar.classList.remove('ux-auto-paused');
    }

    function stepAutoScroll(time) {
        if (!lastTime) lastTime = time;

        const delta = Math.min(40, time - lastTime) / 1000;
        lastTime = time;

        if (canAutoScroll() && !paused && document.visibilityState === 'visible') {
            const maxScroll = bar.scrollWidth - bar.clientWidth;
            let nextScroll = bar.scrollLeft + direction * SPEED_PX_PER_SECOND * delta;

            if (nextScroll >= maxScroll) {
                nextScroll = maxScroll;
                direction = -1;
            }

            if (nextScroll <= 0) {
                nextScroll = 0;
                direction = 1;
            }

            bar.scrollLeft = nextScroll;
        }

        rafId = window.requestAnimationFrame(stepAutoScroll);
    }

    function initSubcategoryAutoScroll() {
        bar = document.querySelector('.aside-categories');
        const list = document.getElementById('categoriesList');

        if (!bar || !list) return;

        bar.addEventListener('pointerdown', function () {
            if (canAutoScroll()) pauseAutoScroll();
        }, { passive: true });

        bar.addEventListener('wheel', function () {
            if (canAutoScroll()) pauseAutoScroll();
        }, { passive: true });

        bar.addEventListener('click', function (event) {
            if (!canAutoScroll()) return;

            if (event.target.closest('button, a')) return;

            if (paused) {
                resumeAutoScroll();
            } else {
                pauseAutoScroll();
            }
        });

        window.addEventListener('resize', function () {
            lastTime = 0;
            if (!canAutoScroll()) {
                resumeAutoScroll();
            }
        });

        document.addEventListener('visibilitychange', function () {
            lastTime = 0;
        });

        if (!rafId) {
            rafId = window.requestAnimationFrame(stepAutoScroll);
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initSubcategoryAutoScroll);
    } else {
        initSubcategoryAutoScroll();
    }
})();
</script>
