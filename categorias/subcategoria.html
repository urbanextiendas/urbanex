/* === URBANEX PATCH MINIMO: LOGO INSTALACION CLARO === */
[id*="install" i] img,
[class*="install" i] img,
[id*="pwa" i] img,
[class*="pwa" i] img {
  object-fit: contain !important;
  background: #000 !important;
  border-radius: 10px !important;
}
/* === FIN URBANEX PATCH MINIMO === */



/* === URBANEX HEADER Y PIE COMO CATEGORIAS === */
.header-top {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 60px;
    z-index: 9999;
    background: rgba(6, 6, 6, 0.96);
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
}
.brand-box {
    display: flex;
    align-items: center;
    min-width: 170px;
}
.brand-box img {
    height: 60px;
    width: auto;
    display: block;
    filter: drop-shadow(0 8px 18px rgba(0,0,0,.72));
}
.search-wrapper {
    flex: 1;
    max-width: 430px;
    margin: 0 20px;
    position: relative;
}
.search-input {
    width: 100%;
    height: 36px;
    background: rgba(0, 0, 0, 0.48);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 20px;
    padding: 8px 40px 8px 16px;
    color: #fff;
    font-size: 12px;
    outline: none;
    text-align: center;
}
.search-input:focus {
    border-color: var(--gold);
    background: rgba(0, 0, 0, 0.64);
}
.search-icon {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 14px;
    height: 14px;
    fill: var(--gold);
}
.user-tools {
    display: flex;
    align-items: center;
    gap: 24px;
}
.location-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
}
.location-indicator svg,
.tool-icon svg {
    width: 18px;
    height: 18px;
    fill: var(--gold);
}
.profile-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1px solid var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
}
.profile-avatar svg {
    width: 13px;
    height: 13px;
    fill: var(--gold);
}
.pie-pagina {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 24px;
    z-index: 9999;
    background: #000;
    color: #8c8c8c;
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-top: 1px solid #1a1a1a;
    font-family: Arial, Helvetica, sans-serif;
}
.pie-pagina p {
    margin: 0;
}
.ux-app {
    top: 60px !important;
    bottom: 24px !important;
}
@media(max-width:900px) {
    .header-top {
        height: 112px;
        display: grid;
        grid-template-columns: 1fr;
        grid-template-rows: 58px 38px;
        gap: 8px;
        padding: 8px 12px 10px;
    }
    .brand-box {
        width: 100%;
        min-width: 0;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .brand-box img {
        height: 56px;
        margin: 0 auto;
    }
    .search-wrapper {
        width: 100%;
        max-width: none;
        margin: 0;
    }
    .search-input {
        height: 38px;
        font-size: 12px;
    }
    .user-tools {
        display: none;
    }
    .ux-app {
        top: 112px !important;
    }
}
/* === FIN URBANEX HEADER Y PIE COMO CATEGORIAS === */


/* === URBANEX PATCH: SUBCATEGORIA SIN BARRA DE SUBCATEGORIAS === */
.ux-left {
    display: none !important;
}
.ux-app {
    grid-template-columns: minmax(0, 1fr) 292px !important;
}
@media(max-width:900px) {
    .ux-app {
        grid-template-columns: 1fr !important;
        grid-template-rows: minmax(0, 1fr) !important;
    }
}
/* === FIN URBANEX PATCH: SUBCATEGORIA SIN BARRA DE SUBCATEGORIAS === */


/* === URBANEX AJUSTE FINAL SUBCATEGORIA === */
.ux-panel-head {
    padding-bottom: 18px !important;
}
.ux-panel-actions {
    margin-bottom: 4px !important;
}
@media(max-width:900px) {
    .ux-panel-head {
        padding-bottom: 16px !important;
    }
    .ux-panel-actions {
        margin-bottom: 2px !important;
    }
}
/* === FIN URBANEX AJUSTE FINAL SUBCATEGORIA === */


/* === URBANEX AJUSTE: SEPARAR BUSCADOR DE LINEA INFERIOR === */
@media(max-width:900px) {
    .header-top {
        height: 124px !important;
        min-height: 124px !important;
        padding: 8px 12px 18px 12px !important;
    }

    .ux-app {
        top: 124px !important;
    }
}
/* === FIN URBANEX AJUSTE: SEPARAR BUSCADOR DE LINEA INFERIOR === */


/* === URBANEX PATCH: PERMITIR ACTUALIZAR AL BAJAR EN CELULAR === */
@media(max-width:900px) {
    html {
        height: auto !important;
        min-height: 100% !important;
        overflow-x: hidden !important;
        overflow-y: auto !important;
        overscroll-behavior-y: auto !important;
    }

    body {
        height: auto !important;
        min-height: calc(100svh + 2px) !important;
        overflow-x: hidden !important;
        overflow-y: auto !important;
        overscroll-behavior-y: auto !important;
        -webkit-overflow-scrolling: touch !important;
    }

    .ux-main-inner {
        overscroll-behavior-y: auto !important;
        -webkit-overflow-scrolling: touch !important;
    }
}
/* === FIN URBANEX PATCH: PERMITIR ACTUALIZAR AL BAJAR EN CELULAR === */

</style>

  content:""!important;

<script id="urbanex-hours-capture-v23">
(function () {
  "use strict";

  if (window.__urbanexHoursCaptureInstalledV23) return;
  window.__urbanexHoursCaptureInstalledV23 = true;

  const store = window.__urbanexHoursStore = window.__urbanexHoursStore || {
    records: [],
    signatures: new Set()
  };

  const originalFetch = window.fetch;
  let hoursRequested = false;

  const normalizeKey = function (value) {
    return String(value || "")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .toLowerCase()
      .replace(/[^a-z0-9]/g, "");
  };

  const relevant = function (object) {
    const pattern = /(id|uuid|nombre|name|title|titulo|business|negocio|empresa|comercio|local|company|horario|schedule|hours|day|weekday|dia|open|close|abre|cierra|apertura|cierre|inicio|fin|desde|hasta|closed|cerrado|active|activo|status|estado)/;

    return Object.keys(object).some(function (key) {
      return pattern.test(normalizeKey(key));
    });
  };

  const add = function (value, depth) {
    if (depth > 8 || value === null || value === undefined) return;

    if (Array.isArray(value)) {
      value.forEach(function (item) {
        add(item, depth + 1);
      });
      return;
    }

    if (typeof value !== "object") return;

    if (relevant(value)) {
      let signature = "";

      try {
        signature = JSON.stringify(value);
      } catch (error) {}

      if (signature && !store.signatures.has(signature)) {
        store.signatures.add(signature);
        store.records.push(value);
      }
    }

    Object.keys(value).forEach(function (key) {
      const nested = value[key];

      if (nested && typeof nested === "object") {
        add(nested, depth + 1);
      }
    });
  };

  const publish = function (payload) {
    const before = store.records.length;
    add(payload, 0);

    if (store.records.length !== before) {
      window.dispatchEvent(new CustomEvent("urbanex:hours-ready"));
    }
  };

  const readResponse = function (response) {
    try {
      response.clone().text().then(function (text) {
        if (!text) return;

        try {
          publish(JSON.parse(text));
        } catch (error) {}
      }).catch(function () {});
    } catch (error) {}
  };

  const extractRequest = function (input, init) {
    let url = "";
    const headers = new Headers();

    try {
      if (typeof input === "string" || input instanceof URL) {
        url = String(input);
      } else if (input && input.url) {
        url = input.url;
        input.headers?.forEach(function (value, key) {
          headers.set(key, value);
        });
      }

      new Headers(init?.headers || {}).forEach(function (value, key) {
        headers.set(key, value);
      });
    } catch (error) {}

    return { url: url, headers: headers };
  };

  const loadBusinessHours = function (request) {
    if (
      hoursRequested ||
      typeof originalFetch !== "function" ||
      !request.url.includes(".supabase.co/rest/v1/")
    ) {
      return;
    }

    const apiKey = request.headers.get("apikey");
    const authorization = request.headers.get("authorization");

    if (!apiKey) return;

    hoursRequested = true;

    try {
      const origin = new URL(request.url).origin;
      const headers = new Headers({
        "apikey": apiKey,
        "Accept": "application/json"
      });

      if (authorization) {
        headers.set("Authorization", authorization);
      } else {
        headers.set("Authorization", "Bearer " + apiKey);
      }

      originalFetch(
        origin + "/rest/v1/business_hours?select=*",
        { method: "GET", headers: headers }
      ).then(function (response) {
        readResponse(response);
        return response;
      }).catch(function () {});
    } catch (error) {}
  };

  if (typeof originalFetch === "function") {
    window.fetch = function (input, init) {
      const request = extractRequest(input, init);
      loadBusinessHours(request);

      return originalFetch.apply(this, arguments).then(function (response) {
        readResponse(response);
        return response;
      });
    };
  }

  const XHR = window.XMLHttpRequest;

  if (typeof XHR === "function") {
    const originalOpen = XHR.prototype.open;
    const originalSetHeader = XHR.prototype.setRequestHeader;
    const originalSend = XHR.prototype.send;

    XHR.prototype.open = function (method, url) {
      this.__urbanexUrl = String(url || "");
      this.__urbanexHeaders = new Headers();
      return originalOpen.apply(this, arguments);
    };

    XHR.prototype.setRequestHeader = function (name, value) {
      try {
        this.__urbanexHeaders?.set(name, value);
      } catch (error) {}

      return originalSetHeader.apply(this, arguments);
    };

    XHR.prototype.send = function () {
      loadBusinessHours({
        url: this.__urbanexUrl || "",
        headers: this.__urbanexHeaders || new Headers()
      });

      this.addEventListener("load", function () {
        try {
          if (typeof this.responseText === "string" && this.responseText.trim()) {
            publish(JSON.parse(this.responseText));
          }
        } catch (error) {}
      }, { once: true });

      return originalSend.apply(this, arguments);
    };
  }
})();
</script>

<script id="urbanex-auto-logo-status-script">
(function () {
  "use strict";

  const grid = document.getElementById("businessGrid");
  if (!grid) return;

  const normalize = function (value) {
    return String(value || "")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .trim()
      .toLowerCase();
  };

  const key = function (value) {
    return normalize(value).replace(/[^a-z0-9]/g, "");
  };

  const valueOf = function (object, names) {
    if (!object || typeof object !== "object") return undefined;

    const lookup = {};

    Object.keys(object).forEach(function (name) {
      lookup[key(name)] = object[name];
    });

    for (const name of names) {
      const value = lookup[key(name)];

      if (value !== undefined && value !== null) {
        return value;
      }
    }

    return undefined;
  };

  const NAME_KEYS = [
    "nombre", "name", "titulo", "title", "razon_social",
    "nombre_comercial", "nombre_negocio", "business_name",
    "company_name", "commercial_name"
  ];

  const ID_KEYS = [
    "id", "uuid", "negocio_id", "business_id", "empresa_id",
    "comercio_id", "local_id", "company_id", "store_id"
  ];

  const FOREIGN_ID_KEYS = [
    "negocio_id", "business_id", "empresa_id", "comercio_id",
    "local_id", "company_id", "store_id"
  ];

  const DAY_KEYS = [
    "day", "weekday", "day_of_week", "day_index", "day_number",
    "dia", "dia_semana", "numero_dia", "nombre_dia"
  ];

  const OPEN_KEYS = [
    "open", "open_time", "opening_time", "opening_hour",
    "opens_at", "abre", "apertura", "hora_apertura",
    "inicio", "start_time", "desde", "from"
  ];

  const CLOSE_KEYS = [
    "close", "close_time", "closing_time", "closing_hour",
    "closes_at", "cierra", "cierre", "hora_cierre",
    "fin", "end_time", "hasta", "to"
  ];

  const SCHEDULE_KEYS = [
    "horario", "horarios", "horario_atencion", "horarios_atencion",
    "schedule", "opening_hours", "business_hours", "hours",
    "semana", "dias"
  ];

  const DAYS = [
    ["domingo", "dom", "sunday", "sun"],
    ["lunes", "lun", "monday", "mon"],
    ["martes", "mar", "tuesday", "tue"],
    ["miercoles", "mie", "wednesday", "wed"],
    ["jueves", "jue", "thursday", "thu"],
    ["viernes", "vie", "friday", "fri"],
    ["sabado", "sab", "saturday", "sat"]
  ];

  const now = function () {
    try {
      const parts = new Intl.DateTimeFormat("es-EC", {
        timeZone: "America/Guayaquil",
        weekday: "long",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }).formatToParts(new Date());

      const data = {};

      parts.forEach(function (part) {
        data[part.type] = part.value;
      });

      const weekday = normalize(data.weekday);
      let dayIndex = DAYS.findIndex(function (aliases) {
        return aliases.includes(weekday);
      });

      if (dayIndex < 0) dayIndex = new Date().getDay();

      return {
        dayIndex: dayIndex,
        minutes: (Number(data.hour) * 60) + Number(data.minute)
      };
    } catch (error) {
      const date = new Date();

      return {
        dayIndex: date.getDay(),
        minutes: (date.getHours() * 60) + date.getMinutes()
      };
    }
  };

  const parseTime = function (input) {
    if (input === undefined || input === null) return null;

    const text = normalize(input);
    const match = text.match(/(\d{1,2})\s*:\s*(\d{2})/);

    if (!match) return null;

    let hour = Number(match[1]);
    const minute = Number(match[2]);

    if (
      !Number.isFinite(hour) ||
      !Number.isFinite(minute) ||
      hour < 0 ||
      hour > 23 ||
      minute < 0 ||
      minute > 59
    ) {
      return null;
    }

    if (/\b(pm|p\.m\.)\b/.test(text) && hour < 12) hour += 12;
    if (/\b(am|a\.m\.)\b/.test(text) && hour === 12) hour = 0;

    return (hour * 60) + minute;
  };

  const matchesDay = function (input, dayIndex) {
    const text = normalize(input);

    if (/^\d+$/.test(text)) {
      const number = Number(text);
      const mondayBased = dayIndex === 0 ? 7 : dayIndex;

      return number === dayIndex || number === mondayBased;
    }

    return DAYS[dayIndex].some(function (alias) {
      return text === alias || text.includes(alias);
    });
  };

  const closedEntry = function (entry) {
    if (entry === false || entry === null) return true;

    const closed = valueOf(entry, ["closed", "is_closed", "cerrado"]);
    const active = valueOf(entry, ["active", "activo"]);
    const state = normalize(valueOf(entry, ["status", "estado"]) || "");

    return (
      closed === true ||
      active === false ||
      /\b(cerrado|closed|inactivo)\b/.test(state)
    );
  };

  const intervals = function (input) {
    if (input === undefined || input === null) return [];

    if (Array.isArray(input)) {
      return input.flatMap(intervals);
    }

    if (typeof input === "object") {
      const open = parseTime(valueOf(input, OPEN_KEYS));
      const close = parseTime(valueOf(input, CLOSE_KEYS));

      if (open !== null && close !== null) {
        return [{ open: open, close: close }];
      }

      for (const nestedKey of [
        "intervalos", "periodos", "turnos", "ranges", "hours", "horas"
      ]) {
        const nested = valueOf(input, [nestedKey]);

        if (nested !== undefined) {
          const result = intervals(nested);
          if (result.length) return result;
        }
      }

      return [];
    }

    const text = normalize(input);

    if (/24\s*horas|24\/7/.test(text)) {
      return [{ open: 0, close: 1440 }];
    }

    const ranges = text.match(
      /\d{1,2}\s*:\s*\d{2}\s*(?:am|pm|a\.m\.|p\.m\.)?\s*(?:-|–|—|a|hasta)\s*\d{1,2}\s*:\s*\d{2}\s*(?:am|pm|a\.m\.|p\.m\.)?/g
    ) || [];

    return ranges.map(function (range) {
      const times = range.match(
        /\d{1,2}\s*:\s*\d{2}\s*(?:am|pm|a\.m\.|p\.m\.)?/g
      ) || [];

      const open = parseTime(times[0]);
      const close = parseTime(times[1]);

      if (open === null || close === null) return null;

      return { open: open, close: close };
    }).filter(Boolean);
  };

  const today = function (schedule, dayIndex) {
    if (schedule === undefined || schedule === null || schedule === "") {
      return undefined;
    }

    if (typeof schedule === "string") {
      try {
        return today(JSON.parse(schedule), dayIndex);
      } catch (error) {
        const text = normalize(schedule);
        const containsDay = DAYS.flat().some(function (alias) {
          return text.includes(alias);
        });

        if (!containsDay) {
          return intervals(schedule).length ? schedule : undefined;
        }

        for (const segment of schedule.split(/\n|;|\|/)) {
          if (matchesDay(segment, dayIndex)) return segment;
        }

        return undefined;
      }
    }

    if (Array.isArray(schedule)) {
      for (const entry of schedule) {
        if (
          entry &&
          typeof entry === "object" &&
          matchesDay(valueOf(entry, DAY_KEYS), dayIndex)
        ) {
          return entry;
        }
      }

      return undefined;
    }

    if (typeof schedule === "object") {
      for (const property of Object.keys(schedule)) {
        if (matchesDay(property, dayIndex)) {
          return schedule[property];
        }
      }

      const directDay = valueOf(schedule, DAY_KEYS);

      if (directDay !== undefined && matchesDay(directDay, dayIndex)) {
        return schedule;
      }

      for (const scheduleKey of SCHEDULE_KEYS) {
        const nested = valueOf(schedule, [scheduleKey]);

        if (nested !== undefined && nested !== schedule) {
          const result = today(nested, dayIndex);
          if (result !== undefined) return result;
        }
      }

      if (intervals(schedule).length) return schedule;
    }

    return undefined;
  };

  const evaluate = function (periods, minutes) {
    if (!periods.length) return null;

    for (const period of periods) {
      if (period.open === 0 && period.close === 1440) {
        return "open";
      }

      if (period.close > period.open) {
        if (minutes >= period.open && minutes < period.close) {
          return "open";
        }
      } else if (
        minutes >= period.open ||
        minutes < period.close
      ) {
        return "open";
      }
    }

    return "closed";
  };

  const cardIdentity = function (card) {
    const ids = new Set();
    const name = normalize(
      card.querySelector(".ux-company-title h3, .ux-card-body h3")?.textContent
    );

    [card, card.closest("a"), card.querySelector("a")]
      .filter(Boolean)
      .forEach(function (element) {
        Array.from(element.attributes || []).forEach(function (attribute) {
          const attributeKey = key(attribute.name);

          if (
            /(id|negocioid|businessid|empresaid|comercioid|localid|companyid|storeid)/.test(attributeKey) &&
            attribute.value
          ) {
            ids.add(String(attribute.value));
          }
        });

        const href = element.getAttribute?.("href");

        if (href) {
          try {
            const url = new URL(href, location.href);

            url.searchParams.forEach(function (value, parameter) {
              if (/(id|negocio|business|empresa|comercio|local|company|store)/i.test(parameter)) {
                ids.add(String(value));
              }
            });
          } catch (error) {}
        }
      });

    return { name: name, ids: ids };
  };

  const idsOf = function (record, names) {
    const result = new Set();

    names.forEach(function (name) {
      const value = valueOf(record, [name]);

      if (value !== undefined && value !== null && value !== "") {
        result.add(String(value));
      }
    });

    return result;
  };

  const intersects = function (first, second) {
    for (const value of first) {
      if (second.has(value)) return true;
    }

    return false;
  };

  const matchedRecords = function (card) {
    const records = window.__urbanexHoursStore?.records || [];
    const identity = cardIdentity(card);
    const matched = [];
    const businessIds = new Set(identity.ids);

    records.forEach(function (record) {
      if (!record || typeof record !== "object") return;

      const recordName = normalize(valueOf(record, NAME_KEYS));
      const recordIds = idsOf(record, ID_KEYS);

      const sameName = (
        identity.name &&
        recordName &&
        (
          identity.name === recordName ||
          identity.name.includes(recordName) ||
          recordName.includes(identity.name)
        )
      );

      if (sameName || intersects(identity.ids, recordIds)) {
        matched.push(record);

        recordIds.forEach(function (id) {
          businessIds.add(id);
        });
      }
    });

    records.forEach(function (record) {
      if (!record || typeof record !== "object") return;

      if (intersects(businessIds, idsOf(record, FOREIGN_ID_KEYS))) {
        matched.push(record);
      }
    });

    return Array.from(new Set(matched));
  };

  const inlineSources = function (card) {
    const sources = [];

    [card].concat(Array.from(card.querySelectorAll("*")))
      .forEach(function (element) {
        Array.from(element.attributes || []).forEach(function (attribute) {
          const attributeKey = key(attribute.name);

          if (
            attributeKey.startsWith("data") &&
            /(horario|schedule|opening|businesshours|hours|open|close|apertura|cierre)/.test(attributeKey) &&
            attribute.value
          ) {
            sources.push(attribute.value);
          }
        });
      });

    return sources;
  };

  const resolve = function (card) {
    const current = now();
    const records = matchedRecords(card);
    const sources = inlineSources(card);
    let hasHours = false;

    records.forEach(function (record) {
      if (
        valueOf(record, DAY_KEYS) !== undefined ||
        valueOf(record, OPEN_KEYS) !== undefined ||
        valueOf(record, CLOSE_KEYS) !== undefined
      ) {
        sources.push(record);
        hasHours = true;
      }

      SCHEDULE_KEYS.forEach(function (scheduleKey) {
        const schedule = valueOf(record, [scheduleKey]);

        if (schedule !== undefined) {
          sources.push(schedule);
          hasHours = true;
        }
      });
    });

    if (sources.length) hasHours = true;

    for (const source of sources) {
      const entry = today(source, current.dayIndex);

      if (entry === undefined) continue;
      if (closedEntry(entry)) return "closed";

      const result = evaluate(intervals(entry), current.minutes);
      if (result) return result;
    }

    return hasHours ? "closed" : null;
  };

  const render = function (card) {
    const footer = card.querySelector(".ux-card-bottom");
    if (!footer) return;

    const originalBadge = footer.querySelector(".ux-badge");
    const originalText = normalize(originalBadge?.textContent);

    let status = resolve(card);

    if (!status && originalText.includes("abierto")) status = "open";
    if (!status && originalText.includes("cerrado")) status = "closed";

    footer.querySelectorAll(
      ".ux-badge,.status-indicator,.status-open,.status-closed"
    ).forEach(function (element) {
      element.remove();
    });

    let badge = footer.querySelector(".ux-opening-status");

    if (!status) {
      badge?.remove();
      return;
    }

    if (!badge) {
      badge = document.createElement("span");
      footer.insertBefore(badge, footer.firstChild);
    }

    const isOpen = status === "open";
    const label = isOpen ? "Abierto" : "Cerrado";

    badge.className =
      "ux-opening-status " + (isOpen ? "is-open" : "is-closed");

    badge.innerHTML =
      '<i aria-hidden="true"></i><span>' + label + "</span>";

    badge.setAttribute("aria-label", "Estado del negocio: " + label);
  };

  const refresh = function () {
    grid.querySelectorAll(".ux-card").forEach(render);
  };

  refresh();

  const observer = new MutationObserver(function (mutations) {
    const changed = mutations.some(function (mutation) {
      return Array.from(mutation.addedNodes).some(function (node) {
        return (
          node instanceof Element &&
          (node.matches(".ux-card") || node.querySelector(".ux-card"))
        );
      });
    });

    if (changed) {
      window.requestAnimationFrame(refresh);
    }
  });

  observer.observe(grid, {
    childList: true,
    subtree: false
  });

  window.addEventListener("urbanex:hours-ready", function () {
    window.requestAnimationFrame(refresh);
  });

  [250, 700, 1400, 2600, 4500, 7000].forEach(function (delay) {
    window.setTimeout(refresh, delay);
  });

  const refreshClock = function () {
    if (!document.hidden) refresh();

    const delay = 60000 - (Date.now() % 60000) + 120;
    window.setTimeout(refreshClock, delay);
  };

  window.setTimeout(refreshClock, 60000);
})();
</script>

</body>
</html>
