<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urbanex</title>
<link rel="icon" type="image/png" href="/imagenes/log.png">
<link rel="shortcut icon" type="image/png" href="/imagenes/log.png">
<link rel="apple-touch-icon" href="/imagenes/log.png">


<style>

/* ================================================== */
/* RESETEO GLOBAL (HABILITA EL GESTO DE REFRESCAR)   */
/* ================================================== */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html, body {
    width: 100%;
    min-height: 100%;
    background: #000;
    font-family: 'Times New Roman', Times, serif, Arial, Helvetica, sans-serif;
    display: flex;
    flex-direction: column;
}

/* ================================================== */
/* PORTADA (AJUSTE EXACTO PARA CUALQUIER PANTALLA)    */
/* ================================================== */
.portada{
    width: 100%;
    height: calc(100vh - 24px);
    height: calc(100svh - 24px); 
    position: relative;
    overflow: hidden;
    background-color: #000;
}

/* Control adaptativo de la imagen */
.portada-img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: fill; 
    display: block;
}

/* CAPA OSCURA REFINADA PARA MEJORAR CONTRASTE DE TEXTOS */
.portada::before{
    content:"";
    position:absolute;
    inset:0;
    background: linear-gradient(
        to bottom,
        rgba(0,0,0,.30),
        rgba(0,0,0,.50)
    );
    z-index: 1;
    pointer-events: none;
}

/* ================================================== */
/* CAPAS DE TEXTO PROFESIONAL Y LEGIBLE (ESCRITORIO)  */
/* ================================================== */

/* Encabezado Superior (Arco de la puerta) */
.header-branding {
    position: absolute;
    top: 0.5%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    width: 100%;
    max-width: 400px;
    z-index: 3;
    pointer-events: none;
}

.header-branding h1 {
    color: #e5c158;
    font-size: 32px;
    font-weight: 400;
    letter-spacing: 4px;
    text-transform: uppercase;
    text-shadow: 0 2px 4px rgba(0,0,0,0.95), 0 4px 10px rgba(0,0,0,0.8);
    margin-bottom: 4px;
}

.header-branding p {
    color: #ffffff;
    font-size: 14px;
    font-weight: 300;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-shadow: 0 2px 4px rgba(0,0,0,0.95);
}

/* Eslogan Lateral Izquierdo (Sobre pilar izquierdo) */
.slogan-lateral {
    position: absolute;
    top: 40%;
    left: 4%;
    width: 26%;
    z-index: 3;
    pointer-events: none;
}

.slogan-lateral h2 {
    color: #ffffff;
    font-size: 22px;
    font-weight: 400;
    letter-spacing: 1px;
    line-height: 1.4;
    text-transform: uppercase;
    text-shadow: 0 2px 6px rgba(0,0,0,0.95);
}

.slogan-lateral h2 span {
    color: #e5c158;
    display: block;
    font-size: 26px;
    font-weight: bold;
    margin: 5px 0;
}

/* Características / Beneficios (Sobre pilar derecho) */
.caracteristicas-lista {
    position: absolute;
    top: 35%;
    right: 4%;
    width: 26%;
    display: flex;
    flex-direction: column;
    gap: 16px;
    z-index: 15;
    pointer-events: auto;
}

.item-caracteristica {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(0, 0, 0, 0.5);
    padding: 10px 14px;
    border-radius: 6px;
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
    border-left: 3px solid #e5c158;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    cursor: pointer;
    text-decoration: none;
    pointer-events: auto;
}

.item-caracteristica:hover {
    border-left-color: #f4d675;
    background: rgba(229, 193, 88, 0.10);
}

.item-caracteristica svg {
    width: 20px;
    height: 20px;
    fill: #e5c158;
    flex-shrink: 0;
}

.item-caracteristica span {
    color: #ffffff;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: bold;
    text-shadow: 0 1px 3px rgba(0,0,0,0.9);
}

/* Botón de Registro Superior Derecho */
.registro-contenedor {
    position: absolute;
    top: 4%;
    right: 4%;
    display: flex;
    align-items: center;
    gap: 15px;
    z-index: 12;
}

.registro-texto {
    color: #ffffff;
    font-size: 13px;
    letter-spacing: 1px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.95);
}

.btn-registro {
    display: inline-block;
    padding: 10px 20px;
    border: 1px solid #e5c158;
    color: #e5c158;
    text-decoration: none;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
    border-radius: 4px;
    background: rgba(0, 0, 0, 0.7);
    transition: all 0.3s ease;
}

.btn-registro:hover {
    background: #e5c158;
    color: #000000;
    box-shadow: 0 0 15px rgba(229, 193, 88, 0.5);
}

/* ================================================== */
/* ÁREA CLICKEABLE DE LA PUERTA                       */
/* ================================================== */
.puerta-link{
    position:absolute;
    top: 18%;
    left: 38%;
    width: 24%;
    height: 58%;
    z-index: 10; 
    display:block;
    cursor:pointer;
    background-color: rgba(255, 255, 255, 0);
}

.puerta-link::after {
    content: "ENTRAR";
    position: absolute;
    bottom: 8%;
    left: 50%;
    transform: translateX(-50%);
    color: #e5c158;
    letter-spacing: 4px;
    font-size: 14px;
    border-bottom: 1px solid #e5c158;
    padding-bottom: 4px;
    opacity: 0;
    transition: opacity 0.3s ease;
    text-shadow: 0 2px 4px #000;
}

.puerta-link:hover::after {
    opacity: 1;
}

/* ================================================== */
/* OPTIMIZACIÓN EXCLUSIVA PARA DISPOSITIVOS MÓVILES    */
/* ================================================== */
@media(max-width:768px){
    /* Se cambia a 'cover' para que la imagen abarque perfectamente la pantalla vertical */
    .portada-img {
        object-fit: cover;
        object-position: center center;
    }

    /* Redefinición del arco de entrada en el móvil */
    .puerta-link{
        top: 22%;
        left: 22%;
        width: 56%;
        height: 54%;
    }

    .puerta-link::after {
        opacity: 1; /* Siempre visible en móvil ya que no existe el hover */
        font-size: 12px;
        bottom: 4%;
    }

    /* Título principal adaptado al arco superior móvil */
    .header-branding {
        top: 2%;
    }

    .header-branding h1 {
        font-size: 24px;
        letter-spacing: 3px;
    }

    .header-branding p {
        font-size: 11px;
        letter-spacing: 1px;
    }

    /* UBICACIÓN CLAVE: El eslogan se coloca en la franja superior de la puerta */
    .slogan-lateral {
        top: 22%;
        left: 5%;
        width: 90%;
        text-align: center;
    }

    .slogan-lateral h2 {
        font-size: 13px;
        letter-spacing: 1px;
    }

    .slogan-lateral h2 span {
        display: inline;
        font-size: 14px;
        margin: 0 5px;
    }

    /* UBICACIÓN CLAVE: Los beneficios se alinean horizontalmente abajo de la puerta */
    .caracteristicas-lista {
        top: auto;
        bottom: 14%;
        left: 5%;
        width: 90%;
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        gap: 6px;
    }

    .item-caracteristica {
        padding: 5px 8px;
        border-left: none;
        border-bottom: 2px solid #e5c158;
        background: rgba(0, 0, 0, 0.7);
    }

    .item-caracteristica svg {
        width: 13px;
        height: 13px;
        gap: 6px;
    }

    .item-caracteristica span {
        font-size: 9px;
        letter-spacing: 0.5px;
    }

    /* UBICACIÓN CLAVE: Registro de negocio toma la base oscura inferior */
    .registro-contenedor {
        top: auto;
        bottom: 3%;
        left: 50%;
        right: auto;
        transform: translateX(-50%);
        flex-direction: row;
        justify-content: center;
        gap: 10px;
        width: 90%;
    }

    .registro-texto {
        font-size: 11px;
    }

    .btn-registro {
        padding: 6px 14px;
        font-size: 11px;
    }
}

/* Ajuste fino para pantallas extremadamente pequeñas */
@media(max-width:380px){
    .caracteristicas-lista {
        bottom: 16%;
    }
    .item-caracteristica span {
        font-size: 8px;
    }
}

/* ================================================== */
/* PIE DE PÁGINA                                      */
/* ================================================== */
.pie-pagina {
    width: 100%;
    height: 24px;
    background-color: #000000;
    color: #8c8c8c;
    font-size: 11px;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    border-top: 1px solid #1a1a1a;
    z-index: 5;
    font-family: Arial, Helvetica, sans-serif;
}

</style>


<style>
/* ================================================== */
/* URBANEX — PORTADA PROFESIONAL RESPONSIVE V4       */
/* Mantiene estructura, imagen, rutas y funcionalidad */
/* ================================================== */

:root{
  --ux-gold:#e5c158;
  --ux-gold-soft:#f4dd9a;
  --ux-ink:#07111e;
  --ux-glass:rgba(5,12,22,.24);
  --ux-glass-strong:rgba(5,12,22,.36);
  --ux-line:rgba(255,255,255,.16);
  --ux-shadow:0 16px 42px rgba(0,0,0,.18);
}

html,body{
  background:#000;
  font-family:Arial,Helvetica,sans-serif;
}

.portada{
  width:100%;
  height:calc(100vh - 30px);
  height:calc(100svh - 30px);
  min-height:620px;
  position:relative;
  overflow:hidden;
  isolation:isolate;
  display:grid;
  grid-template-columns:minmax(260px,.86fr) minmax(360px,1.45fr) minmax(280px,.92fr);
  grid-template-rows:88px minmax(0,1fr) 120px;
  grid-template-areas:
    "brand brand register"
    "slogan center menu"
    ". cta .";
  column-gap:clamp(18px,2.5vw,42px);
  padding:0 clamp(24px,3.5vw,58px);
  background:#0b1624;
}

/* La fotografía se mantiene clara y natural */
.portada-img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center center;
  filter:brightness(1.12) saturate(1.04) contrast(1.01);
  z-index:-3;
}

/* Elimina la capa oscura global original */
.portada::before{
  background:transparent !important;
  z-index:-2;
}

/* Sólo un sombreado muy suave en los extremos para lectura, sin oscurecer la imagen */
.portada::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background:transparent;
}

.header-branding{
  grid-area:brand;
  position:relative;
  top:auto; left:auto; transform:none;
  width:auto; max-width:none;
  align-self:center;
  justify-self:center;
  text-align:center;
  z-index:20;
  pointer-events:none;
}

.header-branding img{
  width:clamp(138px,10vw,178px) !important;
  max-width:none !important;
  height:auto !important;
  filter:drop-shadow(0 4px 12px rgba(0,0,0,.28));
}

.registro-contenedor{
  grid-area:register;
  position:relative;
  top:auto; right:auto; bottom:auto; left:auto; transform:none;
  width:auto;
  align-self:center;
  justify-self:end;
  display:flex;
  z-index:22;
}

.btn-registro{
  min-height:42px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:0 20px;
  border:1px solid rgba(229,193,88,.78);
  border-radius:12px;
  background:rgba(5,12,22,.26);
  color:var(--ux-gold-soft);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  font:700 10px/1 Arial,Helvetica,sans-serif;
  letter-spacing:.9px;
  text-transform:uppercase;
  box-shadow:0 8px 24px rgba(0,0,0,.10);
  transition:transform .2s ease, background .2s ease, color .2s ease;
}
.btn-registro:hover{background:var(--ux-gold);color:#10151b;transform:translateY(-2px)}

.slogan-lateral{
  grid-area:slogan;
  position:relative;
  top:auto; right:auto; bottom:auto; left:auto; transform:none;
  width:auto;
  align-self:center;
  justify-self:start;
  padding:0 0 0 18px;
  border-left:3px solid var(--ux-gold);
  z-index:18;
  pointer-events:none;
}

.slogan-lateral h2{
  margin:0;
  max-width:390px;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  font-size:clamp(28px,2.55vw,39px);
  line-height:1.08;
  font-weight:700;
  letter-spacing:-.6px;
  text-transform:uppercase;
  text-shadow:0 2px 3px rgba(0,0,0,.78),0 8px 22px rgba(0,0,0,.38);
}

/* Acceso central al Boulevard: aprovecha el corredor visual de la foto */
.puerta-link{
  grid-area:cta;
  position:relative;
  top:auto; right:auto; bottom:auto; left:auto;
  width:auto; height:auto;
  align-self:center;
  justify-self:center;
  display:flex;
  align-items:center;
  justify-content:center;
  min-width:220px;
  min-height:46px;
  cursor:pointer;
  background:transparent;
  z-index:18;
  text-decoration:none;
}

.puerta-link::after{
  content:"ENTRAR AL BOULEVARD";
  position:static;
  inset:auto;
  transform:none;
  min-width:max-content;
  padding:12px 22px;
  border:1px solid rgba(229,193,88,.86);
  border-radius:999px;
  background:rgba(5,12,22,.24);
  color:var(--ux-gold-soft);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  font:700 9px/1 Arial,Helvetica,sans-serif;
  letter-spacing:1.15px;
  text-transform:uppercase;
  text-shadow:0 2px 7px rgba(0,0,0,.40);
  box-shadow:0 8px 24px rgba(0,0,0,.10);
  opacity:1;
  transition:transform .2s ease, background .2s ease, color .2s ease;
}
.puerta-link:hover::after{background:var(--ux-gold);color:#11161c;transform:translateY(-2px)}

/* Menú lateral: compacto, elegante y ligero */
.caracteristicas-lista{
  grid-area:menu;
  position:relative;
  top:auto; right:auto; bottom:auto; left:auto; transform:none;
  width:100%;
  align-self:center;
  justify-self:end;
  display:flex;
  flex-direction:column;
  gap:0;
  padding:7px;
  border:1px solid var(--ux-line);
  border-radius:18px;
  background:var(--ux-glass);
  backdrop-filter:blur(12px) saturate(120%);
  -webkit-backdrop-filter:blur(12px) saturate(120%);
  box-shadow:var(--ux-shadow);
  z-index:24;
}

.item-caracteristica{
  min-height:54px;
  display:flex;
  align-items:center;
  gap:11px;
  padding:8px 9px;
  border:0;
  border-left:0;
  border-bottom:1px solid rgba(255,255,255,.10);
  border-radius:10px;
  background:transparent;
  box-shadow:none;
  backdrop-filter:none;
  -webkit-backdrop-filter:none;
  text-decoration:none;
  transition:background .18s ease, transform .18s ease;
}
.item-caracteristica:last-child{border-bottom:0}
.item-caracteristica:hover{background:rgba(255,255,255,.09);transform:translateX(-2px)}

.item-caracteristica svg{
  width:34px;
  height:34px;
  flex:0 0 34px;
  padding:8px;
  border-radius:10px;
  fill:var(--ux-gold);
  background:rgba(229,193,88,.11);
  border:1px solid rgba(229,193,88,.20);
}

.item-caracteristica span{
  min-width:0;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  font-size:9.6px;
  line-height:1.2;
  font-weight:700;
  letter-spacing:.55px;
  text-transform:uppercase;
  text-shadow:0 2px 6px rgba(0,0,0,.35);
}

.item-caracteristica::after{
  content:"›";
  margin-left:auto;
  color:rgba(255,255,255,.68);
  font-family:Arial,Helvetica,sans-serif;
  font-size:20px;
  line-height:1;
  transition:transform .18s ease,color .18s ease;
}
.item-caracteristica:hover::after{color:var(--ux-gold-soft);transform:translateX(2px)}

.pie-pagina{
  width:100%;
  height:30px;
  background:#050608;
  border-top:1px solid rgba(255,255,255,.06);
  color:#8c939b;
  font-family:Arial,Helvetica,sans-serif;
  font-size:9px;
  letter-spacing:.1px;
}
.pie-pagina a{color:#c5cad0;text-decoration:none;transition:color .18s ease}
.pie-pagina a:hover{color:var(--ux-gold)}

.item-caracteristica:focus-visible,.btn-registro:focus-visible,.puerta-link:focus-visible,.pie-pagina a:focus-visible{
  outline:2px solid var(--ux-gold-soft);outline-offset:3px;
}

/* ================================================== */
/* TABLET LANDSCAPE / TABLET                          */
/* ================================================== */
@media (max-width:1100px){
  .portada{
    min-height:650px;
    grid-template-columns:minmax(230px,.82fr) minmax(320px,1.28fr) minmax(240px,.88fr);
    grid-template-rows:82px minmax(0,1fr) 108px;
    column-gap:18px;
    padding:0 24px;
  }
  .header-branding img{width:145px !important}
  .slogan-lateral h2{font-size:clamp(23px,2.8vw,30px)}
  .item-caracteristica{min-height:50px;padding:7px 8px;gap:8px}
  .item-caracteristica svg{width:31px;height:31px;flex-basis:31px;padding:7px}
  .item-caracteristica span{font-size:8.5px;letter-spacing:.35px}
}

/* ================================================== */
/* TABLET PORTRAIT                                    */
/* ================================================== */
@media (max-width:900px){
  .portada{
    height:auto;
    min-height:100svh;
    grid-template-columns:1fr 1fr;
    grid-template-rows:78px auto minmax(300px,1fr) auto;
    grid-template-areas:
      "brand register"
      "slogan slogan"
      "center center"
      "menu menu";
    gap:12px 16px;
    padding:0 20px 18px;

  .header-branding{justify-self:start}
  .registro-contenedor{justify-self:end}

    align-self:start;

    max-width:560px;
    padding-left:14px;

    margin-bottom:18px;
  }
  .caracteristicas-lista{
    grid-area:menu;
    display:grid;

    gap:0;

    align-self:end;

  .item-caracteristica{

    justify-content:center;

    border-right:1px solid rgba(255,255,255,.10);

    padding:7px 8px;
  }

  .item-caracteristica::after{display:none}

  .btn-registro{

    text-align:center;
    background:rgba(5,12,22,.08);
    backdrop-filter:blur(2px);
    -webkit-backdrop-filter:blur(2px);
  }
  .slogan-lateral h2{
    max-width:none;
    font-size:clamp(17px,5vw,22px);
    line-height:1.1;
    letter-spacing:0;
  }

  .puerta-link{
    align-self:end;
    justify-self:center;
    min-width:auto;
    min-height:42px;

  }
  .puerta-link::after{

    letter-spacing:.8px;
  }

  .caracteristicas-lista{
    width:100%;

    grid-template-columns:repeat(2,minmax(0,1fr));

    padding:7px;

    background:rgba(5,12,22,.22);
    backdrop-filter:blur(9px);
    -webkit-backdrop-filter:blur(9px);
  }

    <script>
(function () {

    const portada = document.getElementById('portadaDinamica');
    const logo = document.getElementById('logoDinamico');

    const imagenes = {
        dia: 'https://raw.githubusercontent.com/urbanextiendas/urbanex/main/imagenes/Portada%20d%C3%ADa.png',
        tarde: 'https://raw.githubusercontent.com/urbanextiendas/urbanex/main/imagenes/Portada%20tarde.png',
        noche: 'https://raw.githubusercontent.com/urbanextiendas/urbanex/main/imagenes/Portada%20noche.png'
    };

    const logos = {
        dia: 'https://raw.githubusercontent.com/urbanextiendas/urbanex/main/imagenes/Urba4.png',
        tarde: 'https://raw.githubusercontent.com/urbanextiendas/urbanex/main/imagenes/Urba4.png',
        noche: 'https://raw.githubusercontent.com/urbanextiendas/urbanex/main/imagenes/logo.png'
    };

    function obtenerHoraEcuador() {

        const partes = new Intl.DateTimeFormat('es-EC', {
            timeZone: 'America/Guayaquil',
            hour: '2-digit',
            hourCycle: 'h23'
        }).formatToParts(new Date());

        const hora = partes.find(parte => parte.type === 'hour');

        return Number(hora.value);
    }

    function obtenerFranjaHoraria(hora) {

        if (hora >= 6 && hora < 17) {
            return 'dia';
        } else if (hora >= 17 && hora < 19) {
            return 'tarde';
        } else {
            return 'noche';
        }
    }

    function actualizarBranding() {

        const hora = obtenerHoraEcuador();
        const franja = obtenerFranjaHoraria(hora);

        const nuevaPortada = imagenes[franja];
        const nuevoLogo = logos[franja];

        if (portada && portada.getAttribute('src') !== nuevaPortada) {
            portada.setAttribute('src', nuevaPortada);
        }

        if (logo && logo.getAttribute('src') !== nuevoLogo) {
            logo.setAttribute('src', nuevoLogo);
        }
    }

    actualizarBranding();

    // Comprueba la hora cada minuto sin necesidad de recargar la página
    setInterval(actualizarBranding, 60000);

})();
</script>
