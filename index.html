<style>

/* ================================================== */
/* RESETEO GLOBAL (HABILITA EL GESTO DE REFRESCAR)   */
/* ================================================== */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html, body {
    width: 100%;
    min-height: 100%;
    background: #000;
    font-family: 'Times New Roman', Times, serif, Arial, Helvetica, sans-serif;
    display: flex;
    flex-direction: column;
}

/* ================================================== */
/* PORTADA (AJUSTE EXACTO PARA CUALQUIER PANTALLA)    */
/* ================================================== */
.portada{
    width: 100%;
    height: calc(100vh - 24px);
    height: calc(100svh - 24px); 
    position: relative;
    overflow: hidden;
    background-color: #000;
}

/* Control adaptativo de la imagen */
.portada-img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center center;
    display: block;
    filter: brightness(1.05) saturate(1.03) contrast(1.01);
}

/* SIN PELÍCULA OSCURA GLOBAL: la imagen conserva su luminosidad original */
.portada::before{
    content:"";
    position:absolute;
    inset:0;
    background: transparent;
    z-index: 1;
    pointer-events: none;
}

/* ================================================== */
/* CAPAS DE TEXTO PROFESIONAL Y LEGIBLE (ESCRITORIO)  */
/* ================================================== */

/* Encabezado Superior (Arco de la puerta) */
.header-branding {
    position: absolute;
    top: 0.5%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    width: 100%;
    max-width: 400px;
    z-index: 3;
    pointer-events: none;
}

.header-branding h1 {
    color: #e5c158;
    font-size: 32px;
    font-weight: 400;
    letter-spacing: 4px;
    text-transform: uppercase;
    text-shadow: 0 2px 4px rgba(0,0,0,0.95), 0 4px 10px rgba(0,0,0,0.8);
    margin-bottom: 4px;
}

.header-branding p {
    color: #ffffff;
    font-size: 14px;
    font-weight: 300;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-shadow: 0 2px 4px rgba(0,0,0,0.95);
}

/* Eslogan Lateral Izquierdo (Sobre pilar izquierdo) */
.slogan-lateral {
    position: absolute;
    top: 40%;
    left: 4%;
    width: 26%;
    z-index: 3;
    pointer-events: none;
}

.slogan-lateral h2 {
    color: #ffffff;
    font-size: 22px;
    font-weight: 400;
    letter-spacing: 1px;
    line-height: 1.4;
    text-transform: uppercase;
    text-shadow: 0 2px 6px rgba(0,0,0,0.95);
}

.slogan-lateral h2 span {
    color: #e5c158;
    display: block;
    font-size: 26px;
    font-weight: bold;
    margin: 5px 0;
}

/* Características / Beneficios (Sobre pilar derecho) */
.caracteristicas-lista {
    position: absolute;
    top: 35%;
    right: 4%;
    width: 26%;
    display: flex;
    flex-direction: column;
    gap: 16px;
    z-index: 15;
    pointer-events: auto;
}

.item-caracteristica {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(7, 15, 25, 0.34);
    padding: 11px 14px;
    border-radius: 9px;
    backdrop-filter: blur(9px);
    -webkit-backdrop-filter: blur(9px);
    border: 1px solid rgba(255,255,255,0.10);
    border-left: 3px solid #e5c158;
    box-shadow: 0 8px 22px rgba(0,0,0,0.16);
    cursor: pointer;
    text-decoration: none;
    pointer-events: auto;
    transition: background 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
}

.item-caracteristica:hover {
    border-left-color: #f4d675;
    background: rgba(229, 193, 88, 0.14);
    transform: translateX(-2px);
}

.item-caracteristica svg {
    width: 20px;
    height: 20px;
    fill: #e5c158;
    flex-shrink: 0;
}

.item-caracteristica span {
    color: #ffffff;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: bold;
    text-shadow: 0 1px 3px rgba(0,0,0,0.9);
}

/* Botón de Registro Superior Derecho */
.registro-contenedor {
    position: absolute;
    top: 4%;
    right: 4%;
    display: flex;
    align-items: center;
    gap: 15px;
    z-index: 12;
}

.registro-texto {
    color: #ffffff;
    font-size: 13px;
    letter-spacing: 1px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.95);
}

.btn-registro {
    display: inline-block;
    padding: 10px 20px;
    border: 1px solid #e5c158;
    color: #e5c158;
    text-decoration: none;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
    border-radius: 4px;
    background: rgba(0, 0, 0, 0.7);
    transition: all 0.3s ease;
}

.btn-registro:hover {
    background: #e5c158;
    color: #000000;
    box-shadow: 0 0 15px rgba(229, 193, 88, 0.5);
}

/* ================================================== */
/* ÁREA CLICKEABLE DE LA PUERTA                       */
/* ================================================== */
.puerta-link{
    position:absolute;
    top: 18%;
    left: 38%;
    width: 24%;
    height: 58%;
    z-index: 10; 
    display:block;
    cursor:pointer;
    background-color: rgba(255, 255, 255, 0);
}

.puerta-link::after {
    content: "ENTRAR";
    position: absolute;
    bottom: 8%;
    left: 50%;
    transform: translateX(-50%);
    color: #e5c158;
    letter-spacing: 4px;
    font-size: 14px;
    border-bottom: 1px solid #e5c158;
    padding-bottom: 4px;
    opacity: 0;
    transition: opacity 0.3s ease;
    text-shadow: 0 2px 4px #000;
}

.puerta-link:hover::after {
    opacity: 1;
}

/* ================================================== */
/* OPTIMIZACIÓN EXCLUSIVA PARA DISPOSITIVOS MÓVILES    */
/* ================================================== */
@media(max-width:768px){
    /* Se cambia a 'cover' para que la imagen abarque perfectamente la pantalla vertical */
    .portada-img {
        object-fit: cover;
        object-position: center center;
    }

    /* Redefinición del arco de entrada en el móvil */
    .puerta-link{
        top: 22%;
        left: 22%;
        width: 56%;
        height: 54%;
    }
    
    .puerta-link::after {
        opacity: 1; /* Siempre visible en móvil ya que no existe el hover */
        font-size: 12px;
        bottom: 4%;
    }

    /* Título principal adaptado al arco superior móvil */
    .header-branding {
        top: 2%;
    }

    .header-branding h1 {
        font-size: 24px;
        letter-spacing: 3px;
    }

    .header-branding p {
        font-size: 11px;
        letter-spacing: 1px;
    }

    /* UBICACIÓN CLAVE: El eslogan se coloca en la franja superior de la puerta */
    .slogan-lateral {
        top: 22%;
        left: 5%;
        width: 90%;
        text-align: center;
    }

    .slogan-lateral h2 {
        font-size: 13px;
        letter-spacing: 1px;
    }

    .slogan-lateral h2 span {
        display: inline;
        font-size: 14px;
        margin: 0 5px;
    }

    /* UBICACIÓN CLAVE: Los beneficios se alinean horizontalmente abajo de la puerta */
    .caracteristicas-lista {
        top: auto;
        bottom: 7%;
        left: 4%;
        width: 92%;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
    }

    .item-caracteristica {
        min-width: 0;
        padding: 7px 8px;
        border-left: none;
        border-bottom: 2px solid #e5c158;
        background: rgba(7, 15, 25, 0.38);
    }

    .item-caracteristica:last-child {
        grid-column: 1 / -1;
        justify-content: center;
    }

    .item-caracteristica svg {
        width: 13px;
        height: 13px;
        gap: 6px;
    }

    .item-caracteristica span {
        font-size: 9px;
        letter-spacing: 0.5px;
    }

    /* El encabezado se mantiene arriba también en móvil */
    .registro-contenedor {
        top: 2%;
        right: 3%;
        bottom: auto;
        left: auto;
        transform: none;
        flex-direction: row;
        justify-content: flex-end;
        gap: 8px;
        width: auto;
    }

    .registro-texto {
        font-size: 10px;
    }

    .btn-registro {
        padding: 7px 10px;
        font-size: 8px;
        border-radius: 7px;
        white-space: nowrap;
        background: rgba(7, 15, 25, 0.28);
    }
}

/* Ajuste fino para pantallas extremadamente pequeñas */
@media(max-width:380px){
    .caracteristicas-lista {
        bottom: 6%;
        left: 3%;
        width: 94%;
    }

    .header-branding img{
        width: 34% !important;
    }

    .btn-registro{
        padding: 6px 8px;
        font-size: 7px;
    }

    .item-caracteristica span {
        font-size: 8px;
    }
}

/* ================================================== */
/* PIE DE PÁGINA                                      */
/* ================================================== */
.pie-pagina {
    width: 100%;
    height: 24px;
    background-color: #000000;
    color: #8c8c8c;
    font-size: 11px;
    display: flex;
    justify-content: center;

    text-align: center;
    border-top: 1px solid #1a1a1a;
    z-index: 5;
    font-family: Arial, Helvetica, sans-serif;
}


.pie-pagina a{
    color: inherit;
    text-decoration: none;
}

.pie-pagina a:hover,
.pie-pagina a:focus-visible{
    color: #e5c158;
}

</style>

</head>
