<style>
:root{--bg:#020202;--panel:rgba(7,7,7,.92);--card:rgba(20,20,20,.88);--gold:#e5c158;--gold-dim:#a68b44;--line:rgba(229,193,88,.22);--muted:#aaa;--green:#2ed573;--red:#ff4757;--serif:'Cinzel',serif;--sans:'Montserrat',sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:#fff;font-family:var(--sans);overflow:hidden}.header{height:60px;display:flex;align-items:center;gap:20px;padding:0 20px;background:rgba(6,6,6,.96);border-bottom:1px solid var(--line);position:relative;z-index:1001}.brand img{display:block;height:58px;width:auto}.header-title{font-family:var(--serif);font-size:13px;letter-spacing:2px;color:var(--gold);text-transform:uppercase}.back{margin-left:auto;color:#fff;text-decoration:none;border:1px solid var(--line);padding:8px 13px;border-radius:999px;font-size:10px;font-weight:700}.layout{height:calc(100% - 60px);display:grid;grid-template-columns:355px 1fr}.sidebar{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:800}.tools{padding:16px;border-bottom:1px solid rgba(255,255,255,.07)}.tools h1{font:700 18px var(--serif);letter-spacing:1px;margin:0 0 5px;color:var(--gold)}.tools>p{font-size:10px;color:var(--muted);margin:0 0 14px;line-height:1.5}.search-row{display:grid;grid-template-columns:1fr 38px;gap:7px}.search-box{position:relative}.search-box svg{position:absolute;left:12px;top:12px;width:14px;fill:var(--muted)}#search{width:100%;height:38px;border:1px solid rgba(255,255,255,.13);border-radius:20px;background:rgba(0,0,0,.55);color:#fff;padding:0 14px 0 35px;outline:0;font-family:var(--sans);font-size:10px}#search:focus{border-color:var(--gold)}#voice{border:1px solid var(--line);border-radius:50%;background:rgba(229,193,88,.08);color:var(--gold);cursor:pointer;font-size:16px}#voice.listening{background:var(--red);border-color:var(--red);color:#fff;animation:pulse 1s infinite}@keyframes pulse{50%{transform:scale(.9)}}#category{width:100%;height:36px;margin-top:9px;border:1px solid rgba(255,255,255,.13);border-radius:20px;background:#080808;color:#fff;padding:0 12px;font:10px var(--sans);outline:0}.location-btn{width:100%;margin-top:9px;height:36px;border:0;border-radius:20px;background:var(--gold);color:#000;font:700 10px var(--sans);cursor:pointer}.status-line{min-height:30px;padding:9px 16px;font-size:9px;color:var(--muted);border-bottom:1px solid rgba(255,255,255,.06)}.results{overflow:auto;flex:1;padding:8px}.business{display:grid;grid-template-columns:38px 1fr auto;gap:9px;align-items:center;padding:10px;border:1px solid transparent;border-radius:10px;cursor:pointer;transition:.2s}.business:hover,.business.active{background:rgba(229,193,88,.08);border-color:var(--line)}.business-icon{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;background:rgba(229,193,88,.1);font-size:17px}.business h2{margin:0 0 3px;font-size:11px}.business p{margin:0;font-size:8.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.business-meta{display:flex;gap:8px;margin-top:4px;font-size:8px;color:var(--gold)}.business-distance{color:#ccc}.arrow{color:var(--gold);font-size:17px}.empty{padding:36px 15px;text-align:center;color:var(--muted);font-size:11px;line-height:1.6}.map-wrap{position:relative;min-width:0}.map{width:100%;height:100%;background:#171717}.map-count{position:absolute;z-index:700;top:15px;left:15px;background:rgba(6,6,6,.9);border:1px solid var(--line);border-radius:20px;padding:9px 13px;font-size:9px;box-shadow:0 10px 25px rgba(0,0,0,.5)}.map-count b{color:var(--gold)}.detail{display:none;position:absolute;z-index:700;left:16px;bottom:18px;width:min(370px,calc(100% - 32px));background:rgba(6,6,6,.95);border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:0 18px 45px rgba(0,0,0,.65)}.detail.visible{display:block}.detail-close{position:absolute;right:9px;top:7px;background:none;border:0;color:#aaa;font-size:20px;cursor:pointer}.detail-category{font-size:8px;color:var(--gold);text-transform:uppercase;letter-spacing:1px}.detail h2{font:700 16px var(--serif);margin:5px 28px 6px 0}.detail p{font-size:9px;color:#ccc;line-height:1.5;margin:0 0 12px}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions a{padding:8px 11px;border-radius:7px;text-decoration:none;font-size:8.5px;font-weight:700;background:var(--gold);color:#000}.actions a.secondary{background:rgba(255,255,255,.09);color:#fff}.ux-pin{background:transparent;border:0}.ux-pin span{width:38px;height:38px;border:2px solid var(--gold);background:#080808;color:var(--gold);border-radius:50% 50% 50% 5px;display:grid;place-items:center;transform:rotate(-45deg);box-shadow:0 5px 18px rgba(0,0,0,.7)}.ux-pin b{font-size:15px;transform:rotate(45deg)}.user-pin{background:transparent;border:0}.user-pin span{display:block;width:20px;height:20px;border-radius:50%;background:#2389da;border:4px solid white;box-shadow:0 0 0 5px rgba(35,137,218,.28)}.leaflet-control-zoom a{background:#080808!important;color:var(--gold)!important;border-color:var(--line)!important}.leaflet-control-attribution{background:rgba(0,0,0,.7)!important;color:#aaa}.leaflet-control-attribution a{color:var(--gold)}
@media(max-width:720px){.header{height:54px;padding:0 10px}.brand img{height:52px}.header-title{font-size:9px}.back{font-size:0;padding:8px}.back:after{content:'Volver';font-size:9px}.layout{height:calc(100% - 54px);display:flex;flex-direction:column}.map-wrap{height:52%;order:1}.sidebar{height:48%;order:2;border-right:0;border-top:1px solid var(--line)}.tools{padding:10px 12px}.tools h1,.tools>p{display:none}.search-row{grid-template-columns:1fr 36px}.location-btn,#category{height:32px;margin-top:6px}.status-line{padding:6px 12px;min-height:24px}.results{padding:4px 8px}.business{padding:7px}.business-icon{width:32px;height:32px}.detail{bottom:10px}.map-count{top:10px;left:10px}}
</style>
</head>
<body>
<header class="header"><a class="brand" href="/boulevard.html"><img src="/imagenes/logo.png" alt="Urbanex"></a><span class="header-title">Mapa de negocios</span><a class="back" href="/boulevard.html">Volver al Boulevard</a></header>
<main class="layout">
<aside class="sidebar">
  <div class="tools"><h1>Explore cerca de usted</h1><p>Encuentre comercios registrados en Urbanex y obtenga indicaciones para llegar.</p>
    <div class="search-row"><label class="search-box"><svg viewBox="0 0 24 24"><path d="M9.5 3a6.5 6.5 0 104.1 11.55L19.05 20 20 19.05l-5.45-5.45A6.5 6.5 0 009.5 3zm0 2a4.5 4.5 0 110 9 4.5 4.5 0 010-9z"/></svg><input id="search" type="search" placeholder="Negocio, producto, servicio o dirección" autocomplete="off"></label><button id="voice" type="button" title="Buscar por voz" aria-label="Buscar por voz">🎙</button></div>
    <select id="category" aria-label="Filtrar por categoría"><option value="">Todas las categorías</option></select>
    <button id="locate" class="location-btn" type="button">◎ Mostrar mi ubicación</button>
  </div>
  <div id="status" class="status-line" role="status">Cargando negocios registrados…</div><div id="results" class="results"></div>
</aside>
<section class="map-wrap"><div id="map" class="map"></div><div class="map-count"><b id="visibleCount">0</b> negocios en el mapa</div><article id="detail" class="detail"><button id="detailClose" class="detail-close" aria-label="Cerrar">×</button><span id="detailCategory" class="detail-category"></span><h2 id="detailName"></h2><p id="detailAddress"></p><div id="detailActions" class="actions"></div></article></section>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const supabase=createClient('https://mlkynawsjqmawgxeuvks.supabase.co','sb_publishable_UyYcTuSIaLDbaD73wvwOfA_TbyFlRNv');
const $=id=>document.getElementById(id),map=L.map('map',{zoomControl:false}).setView([-3.99313,-79.20422],14);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);L.control.zoom({position:'bottomright'}).addTo(map);
let businesses=[],categories=[],filtered=[],markers=[],activeId=null,userPosition=null,userMarker=null;
const esc=value=>String(value??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const norm=value=>String(value||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();
const num=value=>{const n=Number(value);return Number.isFinite(n)?n:null};
const coords=b=>{const lat=num(b.latitude??b.lat??b.latitud),lng=num(b.longitude??b.lng??b.lon??b.longitud);return lat===null||lng===null?null:{lat,lng}};
const relation=value=>Array.isArray(value)?value[0]:value;
const catOf=b=>relation(b.categories)||categories.find(c=>String(c.id)===String(b.category_id))||relation(b.subcategories)||categories.find(c=>String(c.id)===String(b.subcategory_id));
const rootCat=b=>{const c=catOf(b);if(c?.parent_id)return categories.find(x=>String(x.id)===String(c.parent_id))||c;return c};
const iconOf=b=>catOf(b)?.icon||rootCat(b)?.icon||'🏪';
const profileUrl=b=>b.slug?`/business/?slug=${encodeURIComponent(b.slug)}`:`/business/?id=${encodeURIComponent(b.id)}`;
const distance=(a,b)=>{const R=6371,dLat=(b.lat-a.lat)*Math.PI/180,dLng=(b.lng-a.lng)*Math.PI/180,x=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))};
function render(){const q=norm($('search').value),cat=$('category').value;filtered=businesses.filter(b=>{const c=rootCat(b),hay=norm([b.name,b.address,b.city,b.description,c?.name,catOf(b)?.name].join(' '));return(!q||hay.includes(q))&&(!cat||String(c?.id)===cat)});if(userPosition)filtered.sort((a,b)=>distance(userPosition,coords(a))-distance(userPosition,coords(b)));markers.forEach(m=>m.remove());markers=[];$('results').innerHTML=filtered.length?filtered.map(b=>{const p=coords(b),d=userPosition&&p?`${distance(userPosition,p).toFixed(1)} km`:'';return `<article class="business ${activeId===b.id?'active':''}" data-id="${esc(b.id)}"><div class="business-icon">${esc(iconOf(b))}</div><div><h2>${esc(b.name||'Negocio')}</h2><p>${esc(b.address||b.city||'Loja')}</p><div class="business-meta"><span>${esc(rootCat(b)?.name||'Negocio')}</span><span class="business-distance">${d}</span></div></div><span class="arrow">›</span></article>`}).join(''):'<div class="empty">No encontramos negocios con estos filtros.</div>';filtered.forEach(b=>{const p=coords(b);if(!p)return;const icon=L.divIcon({className:'ux-pin',html:`<span><b>${esc(iconOf(b))}</b></span>`,iconSize:[38,44],iconAnchor:[19,42]});const marker=L.marker([p.lat,p.lng],{icon}).addTo(map).on('click',()=>selectBusiness(b.id));markers.push(marker)});$('visibleCount').textContent=markers.length;$('status').textContent=`${filtered.length} ${filtered.length===1?'negocio encontrado':'negocios encontrados'}`;document.querySelectorAll('.business').forEach(el=>el.addEventListener('click',()=>selectBusiness(el.dataset.id)))}
function selectBusiness(id){const b=businesses.find(x=>String(x.id)===String(id));if(!b)return;activeId=b.id;const p=coords(b);if(p)map.flyTo([p.lat,p.lng],17);$('detailCategory').textContent=rootCat(b)?.name||'Negocio';$('detailName').textContent=b.name||'Negocio';$('detailAddress').textContent=[b.address,b.city].filter(Boolean).join(' · ')||'Loja, Ecuador';let actions=`<a href="${profileUrl(b)}">Ver perfil</a>`;if(p)actions+=`<a class="secondary" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}">Cómo llegar</a>`;if(b.whatsapp)actions+=`<a class="secondary" target="_blank" rel="noopener" href="https://wa.me/${String(b.whatsapp).replace(/\D/g,'')}">WhatsApp</a>`;$('detailActions').innerHTML=actions;$('detail').classList.add('visible');render()}
async function init(){try{const[cats,biz]=await Promise.all([supabase.from('categories').select('id,name,icon,parent_id,sort_order').order('sort_order').order('name'),supabase.from('businesses').select('*,categories!category_id(id,name,icon,parent_id),subcategories:categories!subcategory_id(id,name,icon,parent_id)').eq('is_active',true).order('name')]);if(cats.error)throw cats.error;if(biz.error)throw biz.error;categories=cats.data||[];businesses=(biz.data||[]).filter(coords);const roots=categories.filter(c=>!c.parent_id);$('category').innerHTML='<option value="">Todas las categorías</option>'+roots.map(c=>`<option value="${esc(c.id)}">${esc(c.icon||'')} ${esc(c.name)}</option>`).join('');render();if(businesses.length){const bounds=L.latLngBounds(businesses.map(coords).map(p=>[p.lat,p.lng]));if(bounds.isValid())map.fitBounds(bounds.pad(.12),{maxZoom:15})}}catch(error){console.error(error);$('status').textContent='No se pudieron cargar los negocios.';$('results').innerHTML='<div class="empty">Revise la conexión e intente nuevamente.</div>'}}
$('search').addEventListener('input',render);$('category').addEventListener('change',render);$('detailClose').addEventListener('click',()=>$('detail').classList.remove('visible'));$('locate').addEventListener('click',()=>{if(!navigator.geolocation)return $('status').textContent='Este navegador no permite ubicación.';$('status').textContent='Obteniendo su ubicación…';navigator.geolocation.getCurrentPosition(pos=>{userPosition={lat:pos.coords.latitude,lng:pos.coords.longitude};if(userMarker)userMarker.remove();const icon=L.divIcon({className:'user-pin',html:'<span></span>',iconSize:[20,20],iconAnchor:[10,10]});userMarker=L.marker([userPosition.lat,userPosition.lng],{icon,zIndexOffset:1000}).addTo(map).bindTooltip('Su ubicación');map.flyTo([userPosition.lat,userPosition.lng],16);render()},()=>{$('status').textContent='No fue posible acceder a su ubicación. Revise el permiso.'},{enableHighAccuracy:true,timeout:10000,maximumAge:60000})});
$('voice').addEventListener('click',()=>{const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SpeechRecognition){$('status').textContent='La búsqueda por voz no está disponible en este navegador.';return}const r=new SpeechRecognition();r.lang='es-EC';r.interimResults=false;r.onstart=()=>{$('voice').classList.add('listening');$('status').textContent='Escuchando…'};r.onresult=e=>{$('search').value=e.results[0][0].transcript;render()};r.onerror=()=>{$('status').textContent='No se pudo reconocer la voz.'};r.onend=()=>$('voice').classList.remove('listening');r.start()});
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});init();
</script>
</body></html>
