<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f0e5">
<title>Urbanex - Mapa de negocios Urbanex</title>
<link rel="icon" type="image/png" href="/imagenes/log.png">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://vrnnlyjwenupkaetaogw.supabase.co" crossorigin>
<link rel="modulepreload" href="https://esm.sh/@supabase/supabase-js@2">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/informativos/urbanex-boulevard-palette.css">
<style>
:root {
    --map-ink: var(--ux-clear-navy, #173a54);
    --map-muted: var(--ux-clear-navy-2, #4d687a);
    --map-gold: var(--ux-clear-gold-dark, #93690f);
    --map-line: var(--ux-clear-line, #e4c98e);
    --map-shadow: var(--ux-clear-shadow, 0 10px 26px rgba(43,63,77,.12));
}
* { box-sizing: border-box; }
body.map-page {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    background: #f5f0e5 !important;
    font: 14px/1.5 Montserrat, system-ui, sans-serif;
}
.header-top {
    min-height: 64px;
    padding: 7px clamp(12px, 3vw, 42px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 1px solid var(--map-line);
    z-index: 1001;
}
.brand img { display: block; width: 115px; height: auto; }
.back-link, .location-btn, .actions a {
    border: 1px solid var(--map-line);
    border-radius: 999px;
    padding: 8px 15px;
    color: var(--map-ink);
    font: 700 12px/1.4 Montserrat, system-ui, sans-serif;
    text-decoration: none;
    background: #fffdf8;
    cursor: pointer;
}
.layout {
    width: 100%;
    margin: 0 auto;
    padding: clamp(10px, 2vw, 28px);
    display: grid;
    grid-template-columns: clamp(265px, 29vw, 420px) minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr);
    gap: clamp(10px, 1.5vw, 20px);
    height: calc(100vh - 64px);
    height: calc(100dvh - 64px);
    min-height: 490px;
}
.sidebar, .map-wrap {
    border: 1px solid var(--map-line);
    border-radius: 20px;
    box-shadow: var(--map-shadow);
    overflow: hidden;
    min-width: 0;
    min-height: 0;
}
.sidebar { display: flex; flex-direction: column; background: #fffdf8; }
.tools { padding: clamp(12px, 1.45vw, 23px); background: linear-gradient(145deg, #fffaf0, #f6eedb); }
.tools h1 { margin: 0 0 6px; font: 700 clamp(20px, 2vw, 30px)/1.15 Cinzel, Georgia, serif; color: var(--map-ink); }
.tools p { margin: 0 0 14px; color: var(--map-muted); font-size: 12px; }
.search-row { display: grid; grid-template-columns: minmax(0, 1fr) 42px; gap: 8px; }
.search-box { position: relative; }
.search-box svg { position: absolute; left: 13px; top: 13px; width: 15px; fill: var(--map-muted); pointer-events: none; }
#search, #category, #voice {
    width: 100%; min-height: 42px; border: 1px solid #d5dfe6; border-radius: 22px;
    color: var(--map-ink); background: #fff; font: inherit; font-size: 12px;
}
#search { padding: 0 12px 0 36px; }
#category { margin-top: 8px; padding: 0 12px; }
#voice { cursor: pointer; }
#voice.listening { background: #f4dfb0; border-color: var(--map-gold); }
.location-btn { margin-top: 8px; min-height: 40px; width: 100%; }
.location-btn:hover, .actions a:hover { background: #fff5dc; }
:focus-visible { outline: 2px solid var(--map-gold); outline-offset: 2px; }
.status-line { padding: 9px 16px; color: var(--map-muted); font-size: 12px; border-block: 1px solid var(--map-line); }
.results { overflow: auto; flex: 1; padding: 10px; }
.business {
    display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 10px; align-items: center;
    margin-bottom: 7px; padding: 9px; border: 1px solid #eee3cc; border-radius: 12px;
    background: #fff; cursor: pointer;
}
.business:hover, .business.active { background: #fff7e4; border-color: var(--map-line); }
.business-icon { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; background: #f7edd8; font-size: 16px; }
.business h2 { margin: 0; font-size: 13px; line-height: 1.25; overflow-wrap: anywhere; }
.business p, .detail p { margin: 3px 0; color: var(--map-muted); font-size: 12px; overflow-wrap: anywhere; }
.business-meta { display: flex; flex-wrap: wrap; gap: 8px; font-size: 11px; font-weight: 600; color: var(--map-gold); }
.business-distance { color: var(--map-muted); }
.arrow { color: var(--map-gold); font-size: 20px; }
.empty { padding: 24px 10px; text-align: center; color: var(--map-muted); font-size: 13px; }
.map-wrap { position: relative; }
.map { width: 100%; height: 100%; background: #e9e5d9; }
.map-count {
    position: absolute; z-index: 700; top: 12px; left: 12px; max-width: calc(100% - 65px);
    padding: 7px 12px; border: 1px solid var(--map-line); border-radius: 999px;
    background: #fffdf8; box-shadow: var(--map-shadow); font-size: 12px;
}
.map-count b, .detail-category { color: var(--map-gold); }
.detail {
    display: none; position: absolute; z-index: 700; left: 12px; bottom: 23px;
    width: min(370px, calc(100% - 24px)); max-height: calc(100% - 75px); overflow: auto; padding: 15px;
    border: 1px solid var(--map-line); border-radius: 15px; background: #fffdf8; box-shadow: var(--map-shadow);
}
.detail.visible { display: block; }
.detail-close { position: absolute; right: 7px; top: 5px; width: 34px; height: 34px; border: 0; border-radius: 50%; background: transparent; color: var(--map-ink); cursor: pointer; font-size: 22px; }
.detail h2 { margin: 4px 28px 4px 0; font: 700 17px/1.25 Montserrat, system-ui, sans-serif; }
.detail-category { font-size: 11px; font-weight: 700; }
.actions { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 10px; }
.actions a:first-child { background: var(--map-ink); color: #fff; }
.ux-pin, .user-pin { background: transparent; border: 0; }
.ux-pin span {
    width: 38px; height: 38px; border: 2px solid var(--map-gold); background: #fffaf0; color: var(--map-ink);
    border-radius: 50% 50% 50% 5px; display: grid; place-items: center;
    transform: rotate(-45deg); box-shadow: 0 3px 10px rgba(23,58,84,.3);
}
.ux-pin b { font-size: 16px; transform: rotate(45deg); }
.user-pin span { display: block; width: 20px; height: 20px; border-radius: 50%; background: #2389da; border: 4px solid #fff; box-shadow: 0 0 0 5px rgba(35,137,218,.28); }
.leaflet-control-attribution a { color: var(--map-ink); }
@media (max-width: 720px) {
    .layout { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto; }
    .map-wrap { grid-row: 1; height: clamp(245px, 42dvh, 450px); }
    .sidebar { max-height: 46rem; }
    .results { min-height: 130px; }
}
</style>
</head>
<body class="map-page">
<header class="header-top"><a class="brand" href="/boulevard.html"><img src="/imagenes/Urba4.png" alt="Urbanex"></a><a class="back-link" href="/boulevard.html">Volver al Boulevard</a></header>
<main class="layout">
<aside class="sidebar">
  <div class="tools"><h1>Mapa de negocios</h1><p>Encuentre negocios y obtenga indicaciones para llegar.</p>
    <div class="search-row"><label class="search-box"><svg viewBox="0 0 24 24"><path d="M9.5 3a6.5 6.5 0 104.1 11.55L19.05 20 20 19.05l-5.45-5.45A6.5 6.5 0 009.5 3zm0 2a4.5 4.5 0 110 9 4.5 4.5 0 010-9z"/></svg><input id="search" type="search" placeholder="Negocio o dirección" autocomplete="off"></label><button id="voice" type="button" title="Buscar por voz" aria-label="Buscar por voz">🎙</button></div>
    <select id="category" aria-label="Filtrar por categoría"><option value="">Todas las categorías</option></select>
    <button id="locate" class="location-btn" type="button">◎ Mostrar mi ubicación</button>
  </div>
  <div id="status" class="status-line" role="status">Cargando negocios registrados…</div><div id="results" class="results"></div>
</aside>
<section class="map-wrap"><div id="map" class="map"></div><div class="map-count"><b id="visibleCount">0</b> negocios en el mapa</div><article id="detail" class="detail"><button id="detailClose" class="detail-close" aria-label="Cerrar">×</button><span id="detailCategory" class="detail-category"></span><h2 id="detailName"></h2><p id="detailAddress"></p><div id="detailActions" class="actions"></div></article></section>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="/urbanex-location.js?v=address"></script>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const supabase=createClient('https://vrnnlyjwenupkaetaogw.supabase.co','sb_publishable_ftfKaU4gg1csyZ0fGXW2Og_YOOLt9G7');
const $=id=>document.getElementById(id),map=L.map('map',{
  zoomControl:false,
  worldCopyJump:false,
  minZoom:6,
  maxBounds:[[-85,-180],[85,180]],
  maxBoundsViscosity:1.0
}).setView([-3.99313,-79.20422],14);
L.control.zoom({ position: 'topright' }).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19,
  noWrap:true,
  attribution:'© OpenStreetMap'
}).addTo(map);
let businesses=[],categories=[],filtered=[],markers=[],activeId=null,userPosition=null,userMarker=null;
const esc=value=>String(value??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const norm=value=>String(value||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();
const num=value=>{const n=Number(value);return Number.isFinite(n)?n:null};
const coords=b=>{const lat=num(b.latitude??b.lat??b.latitud),lng=num(b.longitude??b.lng??b.lon??b.longitud);return lat===null||lng===null?null:{lat,lng}};
const relation=value=>Array.isArray(value)?value[0]:value;
const catOf=b=>relation(b.categories)||categories.find(c=>String(c.id)===String(b.category_id))||relation(b.subcategories)||categories.find(c=>String(c.id)===String(b.subcategory_id));
const rootCat=b=>{const c=catOf(b);if(c?.parent_id)return categories.find(x=>String(x.id)===String(c.parent_id))||c;return c};
const iconOf=b=>catOf(b)?.icon||rootCat(b)?.icon||'🏪';
const profileUrl=b=>b.slug?`/business/?slug=${encodeURIComponent(b.slug)}`:`/business/?id=${encodeURIComponent(b.id)}`;
const distance=(a,b)=>{const R=6371,dLat=(b.lat-a.lat)*Math.PI/180,dLng=(b.lng-a.lng)*Math.PI/180,x=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))};
function render(){const q=norm($('search').value),cat=$('category').value;filtered=businesses.filter(b=>{const c=rootCat(b),hay=norm([b.name,b.address,b.city,b.description,c?.name,catOf(b)?.name].join(' '));return(!q||hay.includes(q))&&(!cat||String(c?.id)===cat)});if(userPosition)filtered.sort((a,b)=>distance(userPosition,coords(a))-distance(userPosition,coords(b)));markers.forEach(m=>m.remove());markers=[];$('results').innerHTML=filtered.length?filtered.map(b=>{const p=coords(b),d=userPosition&&p?`${distance(userPosition,p).toFixed(1)} km`:'';return `<article class="business ${activeId===b.id?'active':''}" data-id="${esc(b.id)}"><div class="business-icon">${esc(iconOf(b))}</div><div><h2>${esc(b.name||'Negocio')}</h2><p>${esc(b.address||b.city||'Loja')}</p><div class="business-meta"><span>${esc(rootCat(b)?.name||'Negocio')}</span><span class="business-distance">${d}</span></div></div><span class="arrow">›</span></article>`}).join(''):'<div class="empty">No encontramos negocios con estos filtros.</div>';filtered.forEach(b=>{const p=coords(b);if(!p)return;const icon=L.divIcon({className:'ux-pin',html:`<span><b>${esc(iconOf(b))}</b></span>`,iconSize:[38,44],iconAnchor:[19,42]});const marker=L.marker([p.lat,p.lng],{icon}).addTo(map).on('click',()=>selectBusiness(b.id));markers.push(marker)});$('visibleCount').textContent=markers.length;$('status').textContent=`${filtered.length} ${filtered.length===1?'negocio encontrado':'negocios encontrados'}`;document.querySelectorAll('.business').forEach(el=>el.addEventListener('click',()=>selectBusiness(el.dataset.id)))}
function selectBusiness(id){const b=businesses.find(x=>String(x.id)===String(id));if(!b)return;activeId=b.id;const p=coords(b);if(p)map.flyTo([p.lat,p.lng],17);$('detailCategory').textContent=rootCat(b)?.name||'Negocio';$('detailName').textContent=b.name||'Negocio';$('detailAddress').textContent=[b.address,b.city].filter(Boolean).join(' · ')||'Loja, Ecuador';let actions=`<a href="${profileUrl(b)}">Ver perfil</a>`;if(p)actions+=`<a class="secondary" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}">Cómo llegar</a>`;if(b.whatsapp)actions+=`<a class="secondary" target="_blank" rel="noopener" href="https://wa.me/${String(b.whatsapp).replace(/\D/g,'')}">WhatsApp</a>`;$('detailActions').innerHTML=actions;$('detail').classList.add('visible');render()}
async function init(){try{const[cats,biz]=await Promise.all([supabase.from('urbanex_public_categories').select('id,name,icon,parent_id,sort_order').order('sort_order').order('name'),supabase.from('urbanex_catalog_recovery').select('*').eq('is_active',true).order('name')]);if(cats.error)throw cats.error;if(biz.error)throw biz.error;categories=cats.data||[];businesses=(biz.data||[])
    .filter(b => window.urbanexLocation.matches(b) && coords(b))
    .map(b => ({ ...b, address: window.urbanexLocation.formatAddress(b.address) }));const roots=categories.filter(c=>!c.parent_id);$('category').innerHTML='<option value="">Todas las categorías</option>'+roots.map(c=>`<option value="${esc(c.id)}">${esc(c.icon||'')} ${esc(c.name)}</option>`).join('');render()}catch(error){console.error(error);$('status').textContent='No se pudieron cargar los negocios.';$('results').innerHTML='<div class="empty">Revise la conexión e intente nuevamente.</div>'}}
$('search').addEventListener('input',render);$('category').addEventListener('change',render);$('detailClose').addEventListener('click',()=>$('detail').classList.remove('visible'));$('locate').addEventListener('click',()=>{if(!navigator.geolocation)return $('status').textContent='Este navegador no permite ubicación.';$('status').textContent='Obteniendo su ubicación…';navigator.geolocation.getCurrentPosition(pos=>{userPosition={lat:pos.coords.latitude,lng:pos.coords.longitude};if(userMarker)userMarker.remove();const icon=L.divIcon({className:'user-pin',html:'<span></span>',iconSize:[20,20],iconAnchor:[10,10]});userMarker=L.marker([userPosition.lat,userPosition.lng],{icon,zIndexOffset:1000}).addTo(map).bindTooltip('Su ubicación');map.setView([userPosition.lat,userPosition.lng],16);try{localStorage.setItem('urbanex_ubicacion',JSON.stringify(userPosition))}catch{}render()},()=>{$('status').textContent='No fue posible acceder a su ubicación. Revise el permiso.'},{enableHighAccuracy:false,timeout:5000,maximumAge:600000})});
$('voice').addEventListener('click',()=>{const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SpeechRecognition){$('status').textContent='La búsqueda por voz no está disponible en este navegador.';return}const r=new SpeechRecognition();r.lang='es-EC';r.interimResults=false;r.onstart=()=>{$('voice').classList.add('listening');$('status').textContent='Escuchando…'};r.onresult=e=>{$('search').value=e.results[0][0].transcript;render()};r.onerror=()=>{$('status').textContent='No se pudo reconocer la voz.'};r.onend=()=>$('voice').classList.remove('listening');r.start()});
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
// Última ubicación guardada: el mapa arranca ahí mientras llega la actual
const ultima=(()=>{try{return JSON.parse(localStorage.getItem('urbanex_ubicacion'))}catch{return null}})();
if(ultima)map.setView([ultima.lat,ultima.lng],16);
init();

</script>
</body>
</html>
